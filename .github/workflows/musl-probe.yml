# Can the Linux bundle run on musl (Alpine) at all?
#
# A question worth an experiment rather than an opinion. The bundle is built
# against glibc — `xveil` links libc.so.6 and Flutter's engine imports
# versioned symbols (GLIBC_2.17, GLIBC_2.18) — and musl has neither a
# libc.so.6 nor symbol versioning. Alpine's `gcompat` exists to bridge exactly
# that gap, and how far it actually gets is the thing to measure.
#
# This probe answers three questions in order, each one useful on its own:
#   1. does the dynamic loader resolve the bundle's libraries under gcompat?
#   2. if not, WHICH symbols are missing — a short list is a patchable gap, a
#      long one is a different libc;
#   3. what does the binary do when it is actually started?
#
# Dispatch-only, and it publishes nothing. It exists to produce evidence.
name: musl probe

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'xVeil release whose linux-x64 bundle to probe'
        required: false
        type: string
        default: 'v0.13.9'

permissions:
  contents: read

jobs:
  probe:
    name: does the glibc bundle load on musl
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: alpine:3.20
    steps:
      - name: What this musl looks like
        run: |
          set -eu
          echo "alpine: $(cat /etc/alpine-release)"
          echo "arch:   $(uname -m)"
          apk add --no-cache curl tar file binutils libc6-compat gcompat \
            gtk+3.0 glib mesa-gl >/dev/null
          echo "gcompat: $(apk info -e gcompat >/dev/null 2>&1 && echo installed || echo MISSING)"
          ls -la /lib/ld-musl-x86_64.so.1 || true
          ls -la /lib/libc.so.6 2>/dev/null || echo "no libc.so.6 (expected on musl; gcompat provides a shim)"

      - name: Fetch the bundle
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          curl -fL --retry 3 -o bundle.tar.gz \
            "https://github.com/veilnetwork/xVeil/releases/download/$TAG/xveil-linux-x64.tar.gz"
          tar -xzf bundle.tar.gz
          ls -la bundle/xveil bundle/lib | head -20

      # The loader's own verdict. `ldd` on musl is the musl loader, and it
      # reports what it cannot resolve rather than guessing.
      - name: What the loader says
        continue-on-error: true
        run: |
          set -eu
          echo "--- file ---"
          file bundle/xveil
          echo "--- interpreter ---"
          readelf -l bundle/xveil | grep -A1 INTERP || true
          echo "--- ldd xveil ---"
          ldd bundle/xveil || true
          echo "--- ldd the flutter engine ---"
          ldd bundle/lib/libflutter_linux_gtk.so || true

      # If it does not load, the interesting number is HOW MANY versioned glibc
      # symbols stand in the way — that is the difference between a shim gap and
      # a different libc.
      - name: Which glibc symbols are demanded
        continue-on-error: true
        run: |
          set -eu
          for so in bundle/xveil bundle/lib/*.so; do
            n="$(readelf -V "$so" 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -u | tr '\n' ' ' || true)"
            [ -n "$n" ] && echo "$(basename "$so"): $n"
          done

      # The gap the first pass measured, closed on purpose.
      #
      # It is two things, and neither is "musl cannot run this":
      #   * four Alpine PACKAGES the tray plugin wants (appindicator and its
      #     dbusmenu friends), which Alpine has;
      #   * exactly TWO libc symbols gcompat does not carry — strtoll_l and
      #     strtoull_l, the locale-aware parsers. musl has the plain ones, and
      #     the locale argument is meaningless in the C locale the engine runs
      #     in, so a ten-line shim answers them honestly.
      - name: Close the gap and ask the loader again
        continue-on-error: true
        run: |
          set -eu
          apk add --no-cache build-base libayatana-appindicator libdbusmenu \
            libdbusmenu-gtk3 >/dev/null 2>&1 || \
            apk add --no-cache build-base libayatana-appindicator >/dev/null 2>&1 || \
            echo "note: some appindicator packages are not in this repo set"
          # Written line by line, not with a heredoc: a heredoc terminator
          # inside a YAML block scalar is indented, and `<<-` strips tabs only.
          {
            echo '#include <stdlib.h>'
            echo 'long long strtoll_l(const char *s, char **e, int b, void *l)'
            echo '{ (void)l; return strtoll(s, e, b); }'
            echo 'unsigned long long strtoull_l(const char *s, char **e, int b, void *l)'
            echo '{ (void)l; return strtoull(s, e, b); }'
            # glibc's _FORTIFY_SOURCE entry points. musl does not implement the
            # fortified variants at all, so forwarding to the plain function is
            # what musl already does for everyone else — the bound is dropped,
            # which is exactly musl's own position on fortification.
            echo '#include <string.h>'
            echo '#include <stdio.h>'
            echo '#include <stdarg.h>'
            echo 'void *__memcpy_chk(void *d, const void *s, size_t n, size_t b)'
            echo '{ (void)b; return memcpy(d, s, n); }'
            echo 'void *__memmove_chk(void *d, const void *s, size_t n, size_t b)'
            echo '{ (void)b; return memmove(d, s, n); }'
            echo 'void *__memset_chk(void *d, int c, size_t n, size_t b)'
            echo '{ (void)b; return memset(d, c, n); }'
            echo 'char *__strcpy_chk(char *d, const char *s, size_t b)'
            echo '{ (void)b; return strcpy(d, s); }'
            echo 'char *__strcat_chk(char *d, const char *s, size_t b)'
            echo '{ (void)b; return strcat(d, s); }'
            echo 'int __vsnprintf_chk(char *s, size_t n, int f, size_t b, const char *fmt, va_list ap)'
            echo '{ (void)f; (void)b; return vsnprintf(s, n, fmt, ap); }'
            echo 'int __snprintf_chk(char *s, size_t n, int f, size_t b, const char *fmt, ...)'
            echo '{ va_list ap; int r; (void)f; (void)b; va_start(ap, fmt);'
            echo '  r = vsnprintf(s, n, fmt, ap); va_end(ap); return r; }'
            echo 'int __sprintf_chk(char *s, int f, size_t b, const char *fmt, ...)'
            echo '{ va_list ap; int r; (void)f; (void)b; va_start(ap, fmt);'
            echo '  r = vsprintf(s, fmt, ap); va_end(ap); return r; }'
            echo 'int __printf_chk(int f, const char *fmt, ...)'
            echo '{ va_list ap; int r; (void)f; va_start(ap, fmt);'
            echo '  r = vprintf(fmt, ap); va_end(ap); return r; }'
            echo 'int __fprintf_chk(FILE *st, int f, const char *fmt, ...)'
            echo '{ va_list ap; int r; (void)f; va_start(ap, fmt);'
            echo '  r = vfprintf(st, fmt, ap); va_end(ap); return r; }'
          } > shim.c
          cc -shared -fPIC -o libmuslcompat_l.so shim.c
          echo "--- ldd with the shim preloaded ---"
          LD_PRELOAD="$PWD/libmuslcompat_l.so" ldd bundle/lib/libflutter_linux_gtk.so 2>&1 | head -20
          echo "--- and the whole bundle ---"
          missing=0
          for so in bundle/xveil bundle/lib/*.so; do
            out="$(LD_PRELOAD="$PWD/libmuslcompat_l.so" ldd "$so" 2>&1 | grep -E 'not found|symbol not found|Error' || true)"
            if [ -n "$out" ]; then
              missing=$((missing+1))
              echo "STILL UNRESOLVED in $(basename "$so"):"
              echo "$out" | head -4
            fi
          done
          echo "objects still unresolved: $missing"
          echo "--- every symbol musl+gcompat could not answer ---"
          # Derived from the artefact, not guessed: whatever the loader names
          # here is exactly what a compatibility shim has to carry. Plugins
          # that only miss libflutter_linux_gtk.so are an artefact of asking
          # ldd about them one at a time, outside the bundle's own rpath — the
          # app itself resolved them, which is why it reached GTK.
          for so in bundle/xveil bundle/lib/*.so; do
            LD_PRELOAD="$PWD/libmuslcompat_l.so" ldd "$so" 2>&1 | \
              grep -oE '[A-Za-z_][A-Za-z0-9_]*: symbol not found' || true
          done | sed 's/: symbol not found//' | sort -u | grep -vE '^(fl_|app_indicator_|JNI_)' \
            | tee missing-symbols.txt
          echo "distinct libc symbols to shim: $(wc -l < missing-symbols.txt)"

      - name: Try to start it
        continue-on-error: true
        run: |
          set -eu
          echo "--- started with the shim; no display, so GTK is the expected wall ---"
          LD_PRELOAD="$PWD/libmuslcompat_l.so" ./bundle/xveil 2>&1 | head -15 || true
