name: webrtc-linux

# Produces libveil_media.so for linux-x64 and android-arm64 — the one input
# those bundles cannot build for themselves. (The name says linux because the
# HOST must be x86_64 Linux for both, not because the targets are.)
#
# veil_media/linux/CMakeLists.txt stops the build outright when that .so is
# missing. Making it used to need a from-source WebRTC in this very job:
# depot_tools, `fetch webrtc`, `gclient sync`, then a codec-stripped
# libwebrtc.a — tens of GB and, measured on run 31696608908, 24m 28s of sync
# plus 12m 55s of ninja to produce an input the actual wrapper build consumes
# in NINETEEN SECONDS.
#
# That WebRTC now arrives PREBUILT. veilnetwork/libwebrtc-builds publishes, per
# WebRTC pin and per target, a pruned slice of the checkout that produced it —
# libwebrtc.a, the clang that compiled it, its __Cr libc++ headers and objects,
# the sysroot, the generated headers — at the same relative paths a real
# checkout has. The wrapper build scripts are therefore unchanged: they replay
# call.cc's own compile command out of compile_commands.json, and that command
# names every one of those things by path.
#
# It still runs on an x86_64 Linux host, because the veil translation units are
# compiled with the bundle's linux-x86_64 clang; and android still needs the
# same host for the same reason it always did.
#
# The result is attached to a GitHub RELEASE, not left as a run artifact. Run
# artifacts expire — GitHub deletes them after the retention window and answers
# 410 Gone forever after — and downloading one needs a credential even here,
# where the repository is public: the artifact METADATA endpoint answers 200
# unauthenticated, the zip answers 401. So a pinned run id is a link that both
# rots on a known date and cannot be followed by a contributor without a token,
# and the recovery is a re-run. Release assets on a public repo have neither
# property. The `publish` job at the bottom is what does it. The prebuilt
# WebRTC is delivered the same way, from the same reasoning, and downloads
# unauthenticated for the same reason.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Space-separated: linux-x64 linux-arm64. Defaults to what every run
          built before the arm64 target existed, so a run that does not ask for
          it behaves exactly as it always did — and a target whose SDK has not
          been published yet cannot fail a run nobody aimed at it.
        required: false
        type: string
        default: 'linux-x64'
      keep_symbols:
        description: 'Skip the strip (bigger .so, symbolicated crashes)'
        required: false
        type: boolean
        default: false
      publish_release:
        description: 'Attach the result to a GitHub Release (durable, no token to download)'
        required: false
        type: boolean
        default: true
      release_tag:
        description: >-
          Release to attach to. Blank means engine-YYYY.MM.DD for today (UTC).
          Name the linux run''s tag here when the windows run should join the
          same release.
        required: false
        type: string
        default: ''
      replace_assets:
        description: >-
          Overwrite assets already published under that tag. Off by default:
          a pin names a tag, so replacing an asset changes what every existing
          pin resolves to.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The same commit the verified macOS and Android engines were built against.
  # The engine and the transport shim call WebRTC APIs whose signatures move
  # between revisions (SendRtp's span, DeliverRtpPacket's arity), so a
  # different pin does not fail to link — it fails to compile, later, in a way
  # that reads like our code is wrong.
  #
  # It is now also the EXPECTED pin handed to fetch-sdk.sh, which refuses —
  # before downloading anything — when the published bundle says otherwise.
  WEBRTC_PIN: '4ef980bc2c70834276c791e71e7834b8809f24ad'
  # Where the prebuilt WebRTC comes from. Each pin gets its own release there,
  # tagged webrtc-<full sha>, so an old bundle stays downloadable forever and
  # this pin resolves to one immutable set of assets.
  VEIL_SDK_REPO: 'veilnetwork/libwebrtc-builds'
  # PINNED BY COMMIT, for exactly the reason depot_tools was (audit X-08):
  # fetch-sdk.sh is code from another repository, executed in this job. A
  # commit sha is immutable; `main` is whatever was pushed this morning.
  #
  # This revision is the pwsh fix that makes the win-x64 branch work at all
  # (see webrtc-windows.yml). It was merged into that repository's main by
  # fast-forward, which is why the sha here did not change on merging: the
  # commit itself is now on main's history, so nothing has to be repointed and
  # no branch has to be kept alive for this pin to stay fetchable.
  # Repointed 2026-08-28. The previous pin named a commit that no longer
  # exists: the deanonymisation pass rewrote libwebrtc-builds' history and
  # every hash in it changed, so this fetch answered 404 and EVERY engine
  # build failed at its first step. It went unseen because these workflows
  # only run on manual dispatch — nothing fires them on a push.
  VEIL_SDK_SCRIPT_PIN: 'c7506a36edb69d307663adc9d9717b527db113f0'
  # The gn arguments the published bundles were built with, copied verbatim
  # from each manifest's `gn_args` (gn's own normalised form: one `key = value`
  # per line of args.gn, sorted, joined with spaces).
  #
  # These are here because the argument list used to live in this file, as a
  # real `gn gen` line, and test/webrtc_android_args_test.dart compared it
  # against the script a person runs on a Linux host — the two had drifted once
  # already. The build moved out of this workflow; the DUPLICATION did not, so
  # neither does the check. The bundle side is asserted below, at fetch time,
  # against the manifest; the local-script side is asserted by that test.
  WEBRTC_GN_ARGS_LINUX: 'enable_libaom = false is_component_build = false is_debug = false rtc_build_examples = false rtc_build_tools = false rtc_enable_protobuf = false rtc_include_opus = true rtc_include_tests = false rtc_use_h264 = false symbol_level = 0 target_cpu = "x64" target_os = "linux" treat_warnings_as_errors = false'
  # Same line, arm64. Kept as its own variable rather than built by string
  # surgery: this value is compared BYTE-FOR-BYTE against the manifest the SDK
  # bundle carries, and a mismatch is how a bundle built with other flags gets
  # noticed instead of linked.
  WEBRTC_GN_ARGS_LINUX_ARM64: 'enable_libaom = false is_component_build = false is_debug = false rtc_build_examples = false rtc_build_tools = false rtc_enable_protobuf = false rtc_include_opus = true rtc_include_tests = false rtc_use_h264 = false symbol_level = 0 target_cpu = "arm64" target_os = "linux" treat_warnings_as_errors = false'
  WEBRTC_GN_ARGS_ANDROID: 'android_static_analysis = "off" enable_libaom = false is_component_build = false is_debug = false rtc_build_examples = false rtc_build_tools = false rtc_enable_protobuf = false rtc_include_opus = true rtc_include_tests = false rtc_use_h264 = false symbol_level = 0 target_cpu = "arm64" target_os = "android" treat_warnings_as_errors = false'

jobs:
  engine:
    name: libveil_media.so (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            gn_args_var: WEBRTC_GN_ARGS_LINUX
          - target: linux-arm64
            gn_args_var: WEBRTC_GN_ARGS_LINUX_ARM64
    # Was 350, for a job that spent thirty-seven of its forty minutes building
    # WebRTC. What is left is a 187 MB download, an extract, and a nineteen-
    # second wrapper build. A timeout is a statement about what "wedged" means
    # for this job, so it moves with the job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      # A target nobody asked for must not fail the run. The arm64 SDK is
      # published separately, and a run aimed at x64 should not depend on it
      # existing yet.
      - name: Skip targets not asked for
        id: want
        run: |
          if echo "${{ inputs.targets }}" | grep -qw "${{ matrix.target }}"; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.target }} was not requested"
          fi

      # `Reclaim disk` used to stand here: the WebRTC checkout plus its build
      # tree did not fit beside the runner's preinstalled toolchains. The
      # bundle is ~930 MB extracted, so there is nothing left to reclaim for.
      #
      # --expect-pin is the safety of this whole arrangement, and fetch-sdk.sh
      # exits 2 without one. The manifest is published as its own 2 KB asset
      # precisely so the comparison costs one request and happens BEFORE the
      # bundle is downloaded.
      - name: WebRTC SDK for ${{ matrix.target }}
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/fetch-sdk.sh" \
            "https://raw.githubusercontent.com/$VEIL_SDK_REPO/$VEIL_SDK_SCRIPT_PIN/scripts/fetch-sdk.sh"
          # NOT `eval "$(fetch-sdk.sh …)"`, which is how the SDK repository's
          # README spells it. `eval` reports the status of what it EVALUATES,
          # so a refusal — wrong pin, no release for this pin — hands eval an
          # empty string, eval exits 0, `set -e` sees nothing wrong, and the
          # build below quietly falls back to the compiled-in default
          # /webrtc/src. The one check this route rests on would be skippable
          # by accident. Run it as its own command, let a non-zero status kill
          # the step, and only then eval what it printed.
          bash "$RUNNER_TEMP/fetch-sdk.sh" --target ${{ matrix.target }} \
            --expect-pin "$WEBRTC_PIN" --into "$RUNNER_TEMP/webrtc-sdk" \
            > "$RUNNER_TEMP/sdk-env.sh"
          cat "$RUNNER_TEMP/sdk-env.sh"
          eval "$(cat "$RUNNER_TEMP/sdk-env.sh")"
          for v in WEBRTC_SRC WEBRTC_OUT WEBRTC_BUILD; do
            [ -n "${!v:-}" ] || { echo "::error::fetch-sdk.sh printed no $v"; exit 1; }
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      # A SECOND pin check, on the bundle that actually landed, made by this
      # repository rather than by the script that fetched it. fetch-sdk.sh
      # compares against the PUBLISHED manifest before downloading; this one
      # compares against the manifest inside the extract, so it also stands
      # when a bundle is already present from an earlier pin (fetch-sdk.sh's
      # own fast path), when --into is pointed at one by hand, or if the
      # fetch script upstream ever changes shape.
      #
      # And it is placed here, before anything is compiled, because the failure
      # being designed against is a mismatch discovered at the LINK — or worse,
      # inside a WebRTC header, where it reads like veil_media is broken.
      - name: The bundle is the WebRTC these sources expect
        env:
          # Which of the per-target gn-args variables this run compares against.
          GN_ARGS_VAR: ${{ matrix.gn_args_var }}
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          manifest="$WEBRTC_BUILD/veil-webrtc-sdk.json"
          [ -f "$manifest" ] || { echo "::error::no $manifest — no bundle was laid out"; exit 1; }
          info="$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["webrtc_pin"], m["target"], m["out_dir"])' "$manifest")"
          got="$(echo "$info" | cut -d' ' -f1)"
          target="$(echo "$info" | cut -d' ' -f2)"
          out="$(echo "$info" | cut -d' ' -f3)"
          echo "bundle: target=$target webrtc=$got out=$out"
          [ "$got" = "$WEBRTC_PIN" ] \
            || { echo "::error::this bundle was built from WebRTC $got; these sources expect $WEBRTC_PIN"; exit 1; }
          [ "$target" = "${{ matrix.target }}" ] \
            || { echo "::error::this bundle is for $target; this job builds ${{ matrix.target }}"; exit 1; }
          # The pin says WHICH WebRTC; this says HOW it was configured. Two
          # bundles from the same commit with different gn args produce
          # different engines — rtc_include_opus alone is the difference
          # between voice messages working and not — and nothing downstream
          # would notice.
          args="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["gn_args"])' "$manifest")"
          if [ "$args" != "${!GN_ARGS_VAR}" ]; then
            echo "::error::the bundle's gn args are not the ones this repository expects"
            echo "  bundle:   $args"
            echo "  expected: $WEBRTC_GN_ARGS_LINUX"
            exit 1
          fi
          cc="$WEBRTC_SRC/$WEBRTC_OUT/compile_commands.json"
          [ -f "$cc" ] || { echo "::error::no $cc — setup.sh did not run, or the bundle is incomplete"; exit 1; }
          # The wrapper build does not read "a compile command", it reads
          # call/call.cc's. No entry, no build — and the message it fails with
          # otherwise names neither the bundle nor the pin.
          python3 -c 'import json,sys; sys.exit(0 if [x for x in json.load(open(sys.argv[1])) if x.get("file","").endswith("call/call.cc")] else 1)' "$cc" \
            || { echo "::error::$cc has no call/call.cc entry — the wrapper build compiles every veil TU with that exact command"; exit 1; }
          ls -la "$WEBRTC_SRC/$WEBRTC_OUT/obj/libwebrtc.a"

      - name: Build libveil_media.so
        if: steps.want.outputs.run == 'yes'
        env:
          VEIL_MEDIA_NO_STRIP: ${{ inputs.keep_symbols && '1' || '' }}
        run: |
          set -euo pipefail
          # patchelf writes the DT_NEEDED on libveilclient_ffi.so; without it
          # the script warns and carries on, and the loader fails to resolve
          # the two datagram symbols at runtime instead.
          sudo apt-get update && sudo apt-get install -y patchelf
          # WEBRTC_SRC and WEBRTC_OUT come from the SDK step, through
          # GITHUB_ENV. The script itself is untouched by this migration —
          # that is the point of shipping a checkout slice rather than a
          # library: the same relative paths, so the same recipe.
          bash third_party/veil/flutter/veil_media/linux/build_veil_media_so_linux.sh

      # The reason this workflow exists at all: the previous out-of-band .so
      # was 12 commits behind and short 10 of the symbols the app looks up. It
      # linked, it bundled, and it would have failed at dlsym on the first
      # call. Comparing the export table against what Dart actually references
      # is the check that turns that into a build failure.
      # `set -o pipefail` is load-bearing now that this is a pipeline: without
      # it the exit status would be tee's, which is always 0, and the gate that
      # exists to catch a stale engine would report success for every engine.
      - name: Every symbol Dart looks up is exported
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          bash scripts/check-media-symbols.sh \
            third_party/veil/flutter/veil_media/linux/libveil_media.so \
            | tee symbol-check.txt

      # An asset with no provenance is the pinned-run problem in a nicer
      # wrapper: you can download it forever and still not know what it was
      # built from. This is written HERE, by the job that knows — the WebRTC
      # pin it actually used, the bundle that supplied it, the submodule commit
      # it compiled, whether it was stripped, and what the symbol gate counted
      # — rather than reconstructed later by the job that uploads it.
      #
      # depot_tools is no longer OURS to record: this job does not run it. The
      # value below is read out of the bundle's manifest, so it says what built
      # the libwebrtc.a that is actually inside this .so, not what this
      # workflow would have used had it built one.
      - name: Provenance for the ${{ matrix.target }} asset
        if: steps.want.outputs.run == 'yes'
        env:
          KEEP_SYMBOLS: ${{ inputs.keep_symbols }}
        run: |
          set -euo pipefail
          so=third_party/veil/flutter/veil_media/linux/libveil_media.so
          manifest="$WEBRTC_BUILD/veil-webrtc-sdk.json"
          field() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get(sys.argv[2],""))' "$manifest" "$1"; }
          mkdir -p provenance
          {
            echo "asset:           libveil_media-${{ matrix.target }}.so"
            echo "installs-as:     libveil_media.so"
            echo "sha256:          $(sha256sum "$so" | cut -d' ' -f1)"
            echo "size:            $(stat -c%s "$so") bytes"
            echo "built:           $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "webrtc:          $WEBRTC_PIN"
            echo "webrtc-sdk:      $VEIL_SDK_REPO webrtc-$WEBRTC_PIN veil-webrtc-sdk-${{ matrix.target }}.tar.xz"
            echo "libwebrtc.a:     sha256 $(field libwebrtc_sha256) ($(field libwebrtc_bytes) bytes)"
            echo "sdk-built-by:    $(field built_by)"
            echo "depot_tools:     $(field depot_tools_pin) (the SDK's, recorded by the run that built libwebrtc.a)"
            echo "clang:           $(field clang_revision)"
            echo "xveil-commit:    $GITHUB_SHA"
            echo "veil-submodule:  $(git -C third_party/veil rev-parse HEAD)"
            echo "workflow:        webrtc-linux.yml (job: engine)"
            echo "run:             $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "stripped:        $([ "$KEEP_SYMBOLS" = "true" ] && echo no || echo yes)"
            echo "symbol-check:    $(cat symbol-check.txt | tr '\n' ' ')"
          } > "provenance/libveil_media-${{ matrix.target }}.so.provenance"
          cat "provenance/libveil_media-${{ matrix.target }}.so.provenance"

      # Unchanged on purpose: the old run-id route still reads this artifact,
      # by this name, expecting exactly this one file. The provenance goes up
      # beside it as its OWN artifact rather than into this one — a second file
      # here would land in android/app/src/main/jniLibs/arm64-v8a on the android
      # consumer, which is a directory gradle packages into the APK.
      # Conditional like every step since `Skip targets not asked for`. Without
      # this the skip was only half a skip: a target nobody asked for built
      # nothing and then failed HERE on `if-no-files-found: error`, so a run
      # aimed at one target came back red for the other — which is exactly the
      # dependency the skip exists to avoid.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.want.outputs.run == 'yes'
        with:
          name: libveil_media-${{ matrix.target }}
          path: third_party/veil/flutter/veil_media/linux/libveil_media.so
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.want.outputs.run == 'yes'
        with:
          name: libveil_media-${{ matrix.target }}-provenance
          path: provenance/libveil_media-${{ matrix.target }}.so.provenance
          if-no-files-found: error

  # Android needs the same treatment and never got it, which is how v0.9.1
  # shipped an APK with no media engine at all. Same host requirement, for a
  # stricter reason: WebRTC's gn asserts host_os=="linux" for Android targets
  # and the NDK it downloads is linux-x86_64 only, so neither a Mac nor an
  # arm64 Linux box can produce this one.
  engine-android:
    name: libveil_media.so (android-arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      # The android bundle carries what the android checkout used to have to
      # fetch through `target_os = ['android']` in .gclient: the NDK's aarch64
      # sysroot (pruned to the one architecture) and the generated headers, plus
      # the libunwind objects this link needs and the linux one does not.
      - name: WebRTC SDK for android-arm64
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/fetch-sdk.sh" \
            "https://raw.githubusercontent.com/$VEIL_SDK_REPO/$VEIL_SDK_SCRIPT_PIN/scripts/fetch-sdk.sh"
          # See the linux job for why this is not `eval "$(fetch-sdk.sh …)"`.
          bash "$RUNNER_TEMP/fetch-sdk.sh" --target android-arm64 \
            --expect-pin "$WEBRTC_PIN" --into "$RUNNER_TEMP/webrtc-sdk" \
            > "$RUNNER_TEMP/sdk-env.sh"
          cat "$RUNNER_TEMP/sdk-env.sh"
          eval "$(cat "$RUNNER_TEMP/sdk-env.sh")"
          for v in WEBRTC_SRC WEBRTC_OUT WEBRTC_BUILD; do
            [ -n "${!v:-}" ] || { echo "::error::fetch-sdk.sh printed no $v"; exit 1; }
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - name: The bundle is the WebRTC these sources expect
        run: |
          set -euo pipefail
          manifest="$WEBRTC_BUILD/veil-webrtc-sdk.json"
          [ -f "$manifest" ] || { echo "::error::no $manifest — no bundle was laid out"; exit 1; }
          info="$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["webrtc_pin"], m["target"], m["out_dir"])' "$manifest")"
          got="$(echo "$info" | cut -d' ' -f1)"
          target="$(echo "$info" | cut -d' ' -f2)"
          out="$(echo "$info" | cut -d' ' -f3)"
          echo "bundle: target=$target webrtc=$got out=$out"
          [ "$got" = "$WEBRTC_PIN" ] \
            || { echo "::error::this bundle was built from WebRTC $got; these sources expect $WEBRTC_PIN"; exit 1; }
          [ "$target" = "android-arm64" ] \
            || { echo "::error::this bundle is for $target; this job builds android-arm64"; exit 1; }
          # See the linux job. android_static_analysis="off" lives in this list
          # and is not an optimisation — it is what makes the build finish at
          # all — which is the sort of thing that must not differ between the
          # bundle and the script a person runs locally.
          args="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["gn_args"])' "$manifest")"
          if [ "$args" != "$WEBRTC_GN_ARGS_ANDROID" ]; then
            echo "::error::the bundle's gn args are not the ones this repository expects"
            echo "  bundle:   $args"
            echo "  expected: $WEBRTC_GN_ARGS_ANDROID"
            exit 1
          fi
          # build_veil_media_so.sh takes WEBRTC_BUILD and derives the rest, with
          # out/android-arm64 written into the script rather than passed in. So
          # a bundle whose out_dir were anything else would be looked for in a
          # directory that does not exist, and the script would report "no
          # compile_commands.json — run build_libwebrtc_android_linux.sh first",
          # which would be a lie. Assert the agreement instead.
          [ "$out" = "out/android-arm64" ] \
            || { echo "::error::the bundle's out_dir is $out; build_veil_media_so.sh looks in out/android-arm64"; exit 1; }
          cc="$WEBRTC_SRC/$out/compile_commands.json"
          [ -f "$cc" ] || { echo "::error::no $cc — setup.sh did not run, or the bundle is incomplete"; exit 1; }
          python3 -c 'import json,sys; sys.exit(0 if [x for x in json.load(open(sys.argv[1])) if x.get("file","").endswith("call/call.cc")] else 1)' "$cc" \
            || { echo "::error::$cc has no call/call.cc entry — the wrapper build compiles every veil TU with that exact command"; exit 1; }
          ls -la "$WEBRTC_SRC/$out/obj/libwebrtc.a"

      - name: Build libveil_media.so
        env:
          VEIL_MEDIA_NO_STRIP: ${{ inputs.keep_symbols && '1' || '' }}
        run: |
          set -euo pipefail
          # patchelf writes DT_NEEDED libveilclient_ffi.so, which is how the
          # two datagram symbols resolve when bionic dlopen's the engine. The
          # script only WARNS when it is missing, and the .so it produces then
          # fails at load on the phone instead of here.
          sudo apt-get update && sudo apt-get install -y patchelf
          # WEBRTC_BUILD is the bundle root and has the same shape the old
          # checkout root had — a src/ with out/android-arm64 under it — so the
          # script is called exactly as before.
          bash third_party/veil/flutter/veil_media/android/build_veil_media_so.sh \
            "$GITHUB_WORKSPACE/engine-out"

      # pipefail, for the reason spelled out in the linux job: tee always exits
      # 0, so without it this gate would pass on every engine ever built.
      - name: Every symbol Dart looks up is exported
        run: |
          set -euo pipefail
          bash scripts/check-media-symbols.sh "$GITHUB_WORKSPACE/engine-out/libveil_media.so" \
            | tee symbol-check.txt

      - name: Provenance for the android-arm64 asset
        env:
          KEEP_SYMBOLS: ${{ inputs.keep_symbols }}
        run: |
          set -euo pipefail
          so="$GITHUB_WORKSPACE/engine-out/libveil_media.so"
          manifest="$WEBRTC_BUILD/veil-webrtc-sdk.json"
          field() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get(sys.argv[2],""))' "$manifest" "$1"; }
          mkdir -p provenance
          {
            echo "asset:           libveil_media-android-arm64.so"
            echo "installs-as:     libveil_media.so"
            echo "sha256:          $(sha256sum "$so" | cut -d' ' -f1)"
            echo "size:            $(stat -c%s "$so") bytes"
            echo "built:           $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "webrtc:          $WEBRTC_PIN"
            echo "webrtc-sdk:      $VEIL_SDK_REPO webrtc-$WEBRTC_PIN veil-webrtc-sdk-android-arm64.tar.xz"
            echo "libwebrtc.a:     sha256 $(field libwebrtc_sha256) ($(field libwebrtc_bytes) bytes)"
            echo "sdk-built-by:    $(field built_by)"
            echo "depot_tools:     $(field depot_tools_pin) (the SDK's, recorded by the run that built libwebrtc.a)"
            echo "clang:           $(field clang_revision)"
            echo "xveil-commit:    $GITHUB_SHA"
            echo "veil-submodule:  $(git -C third_party/veil rev-parse HEAD)"
            echo "workflow:        webrtc-linux.yml (job: engine-android)"
            echo "run:             $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "stripped:        $([ "$KEEP_SYMBOLS" = "true" ] && echo no || echo yes)"
            echo "symbol-check:    $(cat symbol-check.txt | tr '\n' ' ')"
          } > "provenance/libveil_media-android-arm64.so.provenance"
          cat "provenance/libveil_media-android-arm64.so.provenance"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libveil_media-android-arm64
          path: engine-out/libveil_media.so
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libveil_media-android-arm64-provenance
          path: provenance/libveil_media-android-arm64.so.provenance
          if-no-files-found: error

  # THE ONLY JOB HERE THAT CAN WRITE.
  #
  # The jobs above no longer run depot_tools or `gclient sync`, but they still
  # execute code fetched from another repository (fetch-sdk.sh, pinned by
  # commit) and a toolchain downloaded from a release. That is exactly why the
  # workflow-wide `contents: write` was removed from release.yml (audit X-08),
  # and attaching release assets must not quietly put it back. So the write
  # lives in a job that does not build anything — it downloads two artifacts,
  # renames them and uploads. Nothing it runs comes from outside this
  # repository.
  publish:
    name: attach to the engine release
    needs: [engine, engine-android]
    # `!cancelled()` plus an OR, not the implicit `success()`: the two builds
    # fail independently. When android dies and linux does not, the linux
    # engine should still end up somewhere durable rather than being thrown
    # away for its sibling's sake.
    # Kept on lines of EQUAL indentation so `>-` folds them into one line.
    # A deeper-indented continuation is literal in YAML and would leave real
    # newlines inside the expression.
    if: >-
      ${{ !cancelled() && inputs.publish_release
      && (needs.engine.result == 'success'
      || needs['engine-android'].result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: The release this run attaches to
        id: tag
        env:
          REQUESTED: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED:-}"
          [ -n "$tag" ] || tag="engine-$(date -u +%Y.%m.%d)"
          # The engine releases share a tag namespace with the app's own
          # v0.9.1-style releases in this same repository. A mistyped tag would
          # not fail — it would silently staple a 2 MB .so onto a user-facing
          # release. The prefix is cheap and makes that impossible.
          case "$tag" in
            engine-*) ;;
            *) echo "::error::release_tag must start with 'engine-' (got '$tag'). Engine releases share this repository with the app's vX.Y.Z releases."; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "attaching to release $tag"

      - name: linux-x64 engine and its provenance
        if: needs.engine.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: libveil_media-linux-x64*
          path: incoming/linux
          merge-multiple: true

      # Its own directory, not incoming/linux: both architectures build a file
      # called libveil_media.so, and merging them would have one silently
      # overwrite the other — published under a name that says the wrong thing.
      - name: linux-arm64 engine and its provenance
        if: needs.engine.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: libveil_media-linux-arm64*
          path: incoming/linux-arm64
          merge-multiple: true
        continue-on-error: true

      - name: android-arm64 engine and its provenance
        if: needs['engine-android'].result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: libveil_media-android-arm64*
          path: incoming/android
          merge-multiple: true

      # The published NAME differs from the built name on purpose: three
      # platforms all build a file called libveil_media.so, and release assets
      # share one flat namespace per tag. These names are not free-form — they
      # are what scripts/xveil_native_deps.py looks for by exact string.
      - name: Stage the assets under their published names
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -d incoming/linux ]; then
            cp incoming/linux/libveil_media.so dist/libveil_media-linux-x64.so
            cp incoming/linux/libveil_media-linux-x64.so.provenance dist/
          fi
          # Absent whenever the arm64 target was not requested — the matrix job
          # skipped it and uploaded nothing. Not an error: a run aimed at x64
          # publishes x64.
          if [ -d incoming/linux-arm64 ]; then
            cp incoming/linux-arm64/libveil_media.so dist/libveil_media-linux-arm64.so
            cp incoming/linux-arm64/libveil_media-linux-arm64.so.provenance dist/
          fi
          if [ -d incoming/android ]; then
            cp incoming/android/libveil_media.so dist/libveil_media-android-arm64.so
            cp incoming/android/libveil_media-android-arm64.so.provenance dist/
          fi
          # A publish step that uploads nothing succeeds, and this job's whole
          # purpose is that it did not.
          [ -n "$(ls -A dist)" ] || { echo "::error::nothing staged to publish — both engine jobs were skipped or produced no artifact"; exit 1; }
          ls -la dist/
          sha256sum dist/*.so

      # A pin names a TAG. Replacing an asset under a tag that is already
      # pinned changes, silently and retroactively, what every checkout that
      # names it resolves to — the same class of failure as a run id that
      # quietly points at a different build. Re-runs of the same day are the
      # normal way to hit this (a second dispatch, or keep_symbols flipped), so
      # it refuses by default rather than warning.
      - name: Refuse to change what an existing pin means
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPLACE: ${{ inputs.replace_assets }}
        run: |
          set -euo pipefail
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                        --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            echo "release $TAG carries no assets yet — nothing can be clobbered"
            exit 0
          fi
          echo "release $TAG already carries:"; echo "$existing" | sed 's/^/  /'
          clash=0
          for staged in dist/*; do
            name="$(basename "$staged")"
            if grep -qxF -- "$name" <<< "$existing"; then
              echo "  CLASH: $name is already published under $TAG"
              clash=1
            fi
          done
          if [ "$clash" = 1 ] && [ "$REPLACE" != "true" ]; then
            echo "::error::$TAG already carries assets this run would replace. Anything already pinned to $TAG would change meaning without its pin changing. Either dispatch again with a fresh release_tag, or set replace_assets=true if you are deliberately correcting a bad upload."
            exit 1
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: call engine ${{ steps.tag.outputs.tag }}
          # A PRERELEASE, and not because it is unfinished. These are build
          # INPUTS, not something a person downloads and runs. GitHub never
          # marks a prerelease "Latest", so the app's own vX.Y.Z release stays
          # the one the repository front page offers — which it would not if
          # every engine build outranked it by date.
          prerelease: true
          # The windows engine is built by a different workflow on a different
          # host and lands here as a SECOND run against the same tag. Appending
          # lets it add its own block instead of overwriting linux's.
          append_body: true
          # The tag is created at the commit of whichever run got here first;
          # the other run's commit is recorded in its own .provenance asset, so
          # nothing is lost when they differ.
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Prebuilt `libveil_media` call engines. Build inputs, not a download
            for users — the app releases are the `v*` tags.

            These are Release assets rather than run artifacts because run
            artifacts expire on a fixed date and need a credential to download
            even from a public repository. These do neither.

            **Every asset has a sibling `.provenance` file — that is the
            authoritative record** of the WebRTC pin, the prebuilt SDK bundle it
            was linked from, the submodule commit, the sha256 and what the
            symbol gate counted.

            ---

            ### From webrtc-linux.yml

            | | |
            |---|---|
            | WebRTC pin | `${{ env.WEBRTC_PIN }}` |
            | WebRTC SDK | `${{ env.VEIL_SDK_REPO }}` @ `webrtc-${{ env.WEBRTC_PIN }}` |
            | xVeil commit | `${{ github.sha }}` |
            | built by | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |

            Consumed by pinning `ENGINE_RELEASE: '${{ steps.tag.outputs.tag }}'`
            in the matching job of `.github/workflows/release.yml`.
