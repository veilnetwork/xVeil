name: webrtc-linux

# Produces libveil_media.so for linux-x64 and android-arm64 — the one input
# those bundles cannot build for themselves. (The name says linux because the
# HOST must be x86_64 Linux for both, not because the targets are.)
#
# veil_media/linux/CMakeLists.txt stops the build outright when that .so is
# missing, and making it needs a from-source WebRTC: depot_tools, a full
# checkout, gclient sync, then a codec-stripped libwebrtc.a. That is hours of
# work and tens of GB, so it does not belong in the release pipeline — it runs
# here, by hand, and its result is carried forward as an artifact.
#
# It runs on a runner rather than a laptop for the same reason the release
# builds do: an x86_64 Linux host is required (WebRTC's gn asserts on the host
# OS and ships linux-x86_64 toolchains only), and the runner is one, natively,
# for free. Emulating x86_64 elsewhere would put the most expensive build in
# the stack on the slowest possible hardware.
on:
  workflow_dispatch:
    inputs:
      keep_symbols:
        description: 'Skip the strip (bigger .so, symbolicated crashes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The same commit the verified macOS and Android engines were built against.
  # The engine and the transport shim call WebRTC APIs whose signatures move
  # between revisions (SendRtp's span, DeliverRtpPacket's arity), so a
  # different pin does not fail to link — it fails to compile, later, in a way
  # that reads like our code is wrong.
  WEBRTC_PIN: '4ef980bc2c70834276c791e71e7834b8809f24ad'
  WEBRTC_ROOT: /home/runner/webrtc

jobs:
  engine:
    name: libveil_media.so (linux-x64)
    runs-on: ubuntu-latest
    # A GitHub-hosted job is killed at six hours. The checkout and sync take
    # well under one; the rest is ninja on four cores.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      # The WebRTC checkout plus its build tree does not fit beside the
      # runner's preinstalled toolchains, and the failure comes as a confusing
      # write error deep inside gclient rather than as "no space".
      - name: Reclaim disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo apt-get clean
          echo "after:"; df -h / | tail -1

      # PINNED (audit X-08). depot_tools ships auto-updating build tooling that
      # runs with full permissions in this job; `--depth 1` off HEAD meant every
      # run executed whatever was pushed to `main` that day, and a compromise
      # upstream would land straight in the artifacts we publish. Bump the SHA
      # deliberately, the same way the WebRTC commit below is bumped.
      - name: depot_tools
        run: |
          set -euo pipefail
          DEPOT_TOOLS_COMMIT=e154c8eda5e63cbe85a765ae9d06e2b7af05139e
          git clone --filter=blob:none \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          git -C "$HOME/depot_tools" checkout --detach "$DEPOT_TOOLS_COMMIT"
          # depot_tools self-updates on first use unless told not to, which
          # would undo the pin a moment after we set it.
          echo "DEPOT_TOOLS_UPDATE=0" >> "$GITHUB_ENV"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      # Full history, not a shallow fetch: the pin has to be checked out by
      # SHA, and a shallow clone can only do that when the server happens to
      # allow fetching an arbitrary object. Disk is the cheaper thing to spend.
      - name: WebRTC at the pinned commit
        run: |
          set -euo pipefail
          mkdir -p "$WEBRTC_ROOT"
          cd "$WEBRTC_ROOT"
          fetch --nohooks webrtc
          cd src
          git checkout "$WEBRTC_PIN"
          # Transient 429s from the Google mirrors are normal under load; the
          # macOS build needed the retries too.
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "sync attempt $attempt"
            if gclient sync --with_branch_heads --reset --jobs 4; then ok=1; break; fi
            sleep $((attempt * 20))
          done
          [ "$ok" = 1 ] || { echo "::error::gclient sync failed after 6 attempts"; exit 1; }

      # Same switches as the verified Android build, retargeted at linux-x64.
      # --export-compile-commands is not decoration: build_veil_media_so_linux.sh
      # reads call.cc's exact command out of compile_commands.json to compile
      # the engine with the identical clang, sysroot and libc++ namespace.
      - name: Build libwebrtc.a
        run: |
          set -euo pipefail
          cd "$WEBRTC_ROOT/src"
          gn gen out/linux-x64 --export-compile-commands --args='target_os="linux" target_cpu="x64" is_debug=false is_component_build=false symbol_level=0 rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false rtc_enable_protobuf=false rtc_use_h264=false enable_libaom=false rtc_include_opus=true treat_warnings_as_errors=false'
          test -f out/linux-x64/compile_commands.json \
            || { echo "::error::gn produced no compile_commands.json — the engine build reads call.cc's command from it"; exit 1; }
          ninja -C out/linux-x64 webrtc
          ls -la out/linux-x64/obj/libwebrtc.a

      - name: Build libveil_media.so
        env:
          VEIL_MEDIA_NO_STRIP: ${{ inputs.keep_symbols && '1' || '' }}
        run: |
          set -euo pipefail
          # patchelf writes the DT_NEEDED on libveilclient_ffi.so; without it
          # the script warns and carries on, and the loader fails to resolve
          # the two datagram symbols at runtime instead.
          sudo apt-get update && sudo apt-get install -y patchelf
          WEBRTC_SRC="$WEBRTC_ROOT/src" WEBRTC_OUT=out/linux-x64 \
            bash third_party/veil/flutter/veil_media/linux/build_veil_media_so_linux.sh

      # The reason this workflow exists at all: the previous out-of-band .so
      # was 12 commits behind and short 10 of the symbols the app looks up. It
      # linked, it bundled, and it would have failed at dlsym on the first
      # call. Comparing the export table against what Dart actually references
      # is the check that turns that into a build failure.
      - name: Every symbol Dart looks up is exported
        run: bash scripts/check-media-symbols.sh third_party/veil/flutter/veil_media/linux/libveil_media.so

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libveil_media-linux-x64
          path: third_party/veil/flutter/veil_media/linux/libveil_media.so
          if-no-files-found: error

  # Android needs the same treatment and never got it, which is how v0.9.1
  # shipped an APK with no media engine at all. Same host requirement, for a
  # stricter reason: WebRTC's gn asserts host_os=="linux" for Android targets
  # and the NDK it downloads is linux-x86_64 only, so neither a Mac nor an
  # arm64 Linux box can produce this one.
  engine-android:
    name: libveil_media.so (android-arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Reclaim disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo apt-get clean
          echo "after:"; df -h / | tail -1

      # PINNED (audit X-08). depot_tools ships auto-updating build tooling that
      # runs with full permissions in this job; `--depth 1` off HEAD meant every
      # run executed whatever was pushed to `main` that day, and a compromise
      # upstream would land straight in the artifacts we publish. Bump the SHA
      # deliberately, the same way the WebRTC commit below is bumped.
      - name: depot_tools
        run: |
          set -euo pipefail
          DEPOT_TOOLS_COMMIT=e154c8eda5e63cbe85a765ae9d06e2b7af05139e
          git clone --filter=blob:none \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          git -C "$HOME/depot_tools" checkout --detach "$DEPOT_TOOLS_COMMIT"
          # depot_tools self-updates on first use unless told not to, which
          # would undo the pin a moment after we set it.
          echo "DEPOT_TOOLS_UPDATE=0" >> "$GITHUB_ENV"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      # target_os=android has to be in .gclient BEFORE the sync, or the NDK and
      # the android sysroot are simply never fetched and gn fails later on a
      # missing toolchain rather than on the thing that is actually wrong.
      - name: WebRTC at the pinned commit
        run: |
          set -euo pipefail
          mkdir -p "$WEBRTC_ROOT"
          cd "$WEBRTC_ROOT"
          fetch --nohooks webrtc
          grep -q "target_os" .gclient || echo "target_os = ['android']" >> .gclient
          cd src
          git checkout "$WEBRTC_PIN"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "sync attempt $attempt"
            if gclient sync --with_branch_heads --reset --jobs 4; then ok=1; break; fi
            sleep $((attempt * 20))
          done
          [ "$ok" = 1 ] || { echo "::error::gclient sync failed after 6 attempts"; exit 1; }

      # Same args as veil_media/android/build_libwebrtc_android_linux.sh, with
      # --export-compile-commands added. That script omits it and then prints a
      # line claiming the file exists; build_veil_media_so.sh reads call.cc's
      # exact command out of that file and refuses to start without it, so the
      # pair as shipped cannot actually run end to end. Done inline here rather
      # than patched in the submodule, mirroring the linux job above.
      - name: Build libwebrtc.a
        run: |
          set -euo pipefail
          cd "$WEBRTC_ROOT/src"
          gn gen out/android-arm64 --export-compile-commands --args='target_os="android" target_cpu="arm64" is_debug=false is_component_build=false symbol_level=0 rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false rtc_enable_protobuf=false rtc_use_h264=false enable_libaom=false rtc_include_opus=true treat_warnings_as_errors=false'
          test -f out/android-arm64/compile_commands.json \
            || { echo "::error::gn produced no compile_commands.json — the engine build reads call.cc's command from it"; exit 1; }
          ninja -C out/android-arm64 webrtc
          ls -la out/android-arm64/obj/libwebrtc.a

      - name: Build libveil_media.so
        env:
          VEIL_MEDIA_NO_STRIP: ${{ inputs.keep_symbols && '1' || '' }}
        run: |
          set -euo pipefail
          # patchelf writes DT_NEEDED libveilclient_ffi.so, which is how the
          # two datagram symbols resolve when bionic dlopen's the engine. The
          # script only WARNS when it is missing, and the .so it produces then
          # fails at load on the phone instead of here.
          sudo apt-get update && sudo apt-get install -y patchelf
          WEBRTC_BUILD="$WEBRTC_ROOT" \
            bash third_party/veil/flutter/veil_media/android/build_veil_media_so.sh \
            "$GITHUB_WORKSPACE/engine-out"

      - name: Every symbol Dart looks up is exported
        run: bash scripts/check-media-symbols.sh "$GITHUB_WORKSPACE/engine-out/libveil_media.so"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libveil_media-android-arm64
          path: engine-out/libveil_media.so
          if-no-files-found: error
