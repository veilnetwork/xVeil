# What looks at a commit before a tag is built from it.
#
# Until today: nothing. `flutter analyze` and the test suite existed only
# inside release.yml, gating the tag — so a defect landed on main, sat there,
# and was found by the release that was already being cut. The reason was the
# same one veil had, an Actions-minutes budget; this repository is public and
# GitHub-hosted standard runners are free for public repositories, so that
# reason no longer applies.
#
# Deliberately the cheap half of release.yml: analyze, the Dart test suite, and
# the build-support checks. The bundles are not built here — five platform legs
# per push is a different order of cost and the release workflow already proves
# them, on demand and at the tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a series of pushes only needs the last one gated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

# Nothing here publishes, so nothing here needs a token that can write.
permissions:
  contents: read

jobs:
  reachable:
    name: the triggers name a branch that exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # The parser first, against fixtures. It reads YAML by hand, and its
          # first version took only the first item of a block list — so
          # `[master, main]` and `[main, master]` gave different verdicts.
          ./scripts/check-workflow-branches.sh --self-test
          ./scripts/check-workflow-branches.sh

  checks:
    name: analyze + tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-support:
    name: build support
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Guards over builder.py itself: which ABIs an APK may carry, that the
      # windows bundle path follows its host, that a stray APK is refused.
      # None of them needs a toolchain, and all of them gate a release.
      - run: python scripts/test-build-support.py
