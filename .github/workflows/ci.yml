# What looks at a commit before a tag is built from it.
#
# Until today: nothing. `flutter analyze` and the test suite existed only
# inside release.yml, gating the tag — so a defect landed on main, sat there,
# and was found by the release that was already being cut. The reason was the
# same one veil had, an Actions-minutes budget; this repository is public and
# GitHub-hosted standard runners are free for public repositories, so that
# reason no longer applies.
#
# Deliberately the cheap half of release.yml: analyze, the Dart test suite, and
# the build-support checks. The bundles are not built here — five platform legs
# per push is a different order of cost and the release workflow already proves
# them, on demand and at the tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a series of pushes only needs the last one gated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

# Nothing here publishes, so nothing here needs a token that can write.
permissions:
  contents: read

jobs:
  windows-audio-probe:
    name: Windows audio diagnostic helper
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64
      - shell: pwsh
        run: ./scripts/test-windows-audio-probe.ps1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_builder_path_remap.py
      - run: python -m unittest discover -s scripts -p test_aot_build.py

  reachable:
    name: the triggers name a branch that exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # The parser first, against fixtures. It reads YAML by hand, and its
          # first version took only the first item of a block list — so
          # `[master, main]` and `[main, master]` gave different verdicts.
          ./scripts/check-workflow-branches.sh --self-test
          ./scripts/check-workflow-branches.sh

  pins:
    name: every tool CI installs is pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The NDK helper was installed unpinned, taking whatever crates.io
      # served at the moment the job ran — so the APKs a release ships could
      # be built by tooling that changed with no commit here to point at.
      # veil and hidden-volume gate this; this repository, the one that
      # actually ships the phone build, did not.
      #
      # (The wording avoids the phrase the script greps for: it reads the
      # workflows as text, and a comment quoting the command reddens it.)
      - run: ./scripts/check-workflow-pins.sh

  checks:
    name: analyze + tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.97.1'
      - name: Build the isolated filesystem test fixture
        run: |
          fs_fixture_target="$RUNNER_TEMP/veil-fs-fixture-target"
          CARGO_TARGET_DIR="$fs_fixture_target" cargo build --locked \
            --manifest-path third_party/veil/crates/veilclient-ffi/tests/fs_fixture/Cargo.toml
          printf 'XVEIL_FS_TEST_DYLIB=%s\n' "$fs_fixture_target/debug/libveil_fs_test_ffi.so" >> "$GITHUB_ENV"
          printf 'XVEIL_REQUIRE_FOLDER_FS=1\n' >> "$GITHUB_ENV"
      - run: flutter test
      # A moved document leaves a link that still looks like a link.
      # README and INSTALL both described an app and a set of published
      # builds that had moved on without them; this catches the half of
      # that rot a machine can see. Self-test first.
      - run: python3 scripts/check-docs.py --self-test
      - run: python3 scripts/check-docs.py

  build-support:
    name: build support
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Guards over builder.py itself: which ABIs an APK may carry, that the
      # windows bundle path follows its host, that a stray APK is refused.
      # None of them needs a toolchain, and all of them gate a release.
      - run: python scripts/test-build-support.py
      - run: python3 scripts/test_android_network_assets.py
      - run: python3 scripts/test_check_aot_source_paths.py
      - run: python3 -m unittest discover -s scripts -p test_aot_package_roots.py
      - run: python3 -m unittest discover -s scripts -p test_aot_workspace.py
      - run: python3 -m unittest discover -s scripts -p test_aot_build.py
      - run: python3 -m unittest discover -s scripts -p test_strip_macos_debug_info.py
      - run: python3 -m unittest discover -s scripts -p test_check_media_symbols.py
      - run: python3 scripts/test-android-native-deps.py
      - run: python3 -m unittest discover -s scripts -p test_scan_artifacts.py
      - run: python3 -m unittest discover -s scripts -p test_veil_connect_agent.py -v

  macos-packaging:
    name: macOS native packaging
    timeout-minutes: 10
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Real clang/dsymutil/strip/codesign and a loaded native function. The
      # Linux job covers input guards but skips this platform-specific proof.
      - run: python3 -m unittest discover -s scripts -p test_strip_macos_debug_info.py
      - run: python3 -m unittest discover -s scripts -p test_macos_native_load.py
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.97.1'
      - run: python3 third_party/veil/scripts/test_release_proc_macros.py
      - run: python3 third_party/veil/scripts/test_release_proc_macros.py --workspace third_party/hidden-volume
      - run: python3 third_party/veil/scripts/test_release_staging.py
