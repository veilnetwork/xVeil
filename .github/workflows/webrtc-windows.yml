name: webrtc-windows

# Produces veil_media.dll for win-x64 and win-arm64 — the one input the Windows
# bundle cannot
# build for itself, and the one it has never had. Every published Windows zip
# up to and including v0.9.1 shipped without it: voice messages, video notes,
# calls and speech-to-text all throw at the first LoadLibrary.
#
# Separate from webrtc-linux because this one needs a WINDOWS host (the
# checkout's clang-cl, Microsoft's headers and Media Foundation), where that one
# needs an x86_64 Linux host for its own target and for android. Same shape
# otherwise: run it by hand, carry the result forward as an artifact, pin the
# run in the release workflow.
#
# The WebRTC it links against arrives PREBUILT — see the header of
# webrtc-linux.yml. This job used to spend 30m 47s on `fetch` + `gclient sync`
# and 27m 29s on `ninja -C out/win-x64 webrtc` (run 30665287484) to produce an
# input the wrapper build consumes in EIGHTEEN SECONDS. With the bundle,
# depot_tools, DEPOT_TOOLS_WIN_TOOLCHAIN and the git.bat bootstrap that pinning
# depot_tools switched off are all gone with the checkout that needed them.
#
# What the Windows bundle deliberately does NOT carry is Microsoft's headers
# and import libraries — they are not ours to redistribute, the same way the
# Apple bundles carry no macOS SDK. gn writes those as -imsvc paths relative to
# the build directory; the bundle records them absolutely and its setup.ps1
# repoints them at the Visual Studio installed on THIS machine. The link reads
# LIB for the import libraries, which is handled in the build step below.
#
# Like webrtc-linux.yml, the result is attached to a GitHub RELEASE and not
# left as a run artifact — artifacts expire and need a credential to download.
# It attaches to the SAME release as the linux engines: pass that run's tag as
# `release_tag` so all three engines from one WebRTC pin sit together.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Space-separated: win-x64 win-arm64. Defaults to what every run built
          before the arm64 target existed, so a run that does not ask for it
          behaves exactly as it always did.
        required: false
        type: string
        default: 'win-x64'
      keep_symbols:
        description: 'Skip the strip (bigger .dll, symbolicated crashes)'
        required: false
        type: boolean
        default: false
      publish_release:
        description: 'Attach the result to a GitHub Release (durable, no token to download)'
        required: false
        type: boolean
        default: true
      release_tag:
        description: >-
          Release to attach to. Blank means engine-YYYY.MM.DD for today (UTC).
          Set this to the tag the webrtc-linux run used so all three engines
          land in one release.
        required: false
        type: string
        default: ''
      replace_assets:
        description: >-
          Overwrite assets already published under that tag. Off by default:
          a pin names a tag, so replacing an asset changes what every existing
          pin resolves to.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The same commit every other verified engine was built against — see the
  # note in webrtc-linux.yml: a different pin does not fail to link, it fails
  # to compile in a way that reads like our code is wrong. It is also the
  # EXPECTED pin handed to fetch-sdk.sh, which refuses before downloading when
  # the published bundle disagrees.
  WEBRTC_PIN: '4ef980bc2c70834276c791e71e7834b8809f24ad'
  VEIL_SDK_REPO: 'veilnetwork/libwebrtc-builds'
  # PINNED BY COMMIT — see webrtc-linux.yml. Same value in both workflows on
  # purpose: one script, one revision of it, whatever host runs it.
  #
  # This particular revision is what makes THIS workflow work. fetch-sdk.sh's
  # win-x64 branch had never been run by anything, and it laid the bundle out
  # with `powershell.exe` — Windows PowerShell 5.1 — where the bundle's own
  # setup.ps1 needs PowerShell 7: it assigns through a variable property name
  # on what ConvertFrom-Json returned, and 5.1 answers "The property
  # 'directory' cannot be found on this object" at setup.ps1:81. Both hosts,
  # one bundle, back to back on one runner: 5.1.26100.33158 exits 1, pwsh
  # 7.6.4 exits 0 (run 31714489182). The pinned commit prefers pwsh.
  #
  # It landed on veilnetwork/libwebrtc-builds' main by fast-forward, so this
  # sha IS a commit on that branch's history — nothing to repoint.
  # Repointed 2026-08-28. The previous pin named a commit that no longer
  # exists: the deanonymisation pass rewrote libwebrtc-builds' history and
  # every hash in it changed, so this fetch answered 404 and EVERY engine
  # build failed at its first step. It went unseen because these workflows
  # only run on manual dispatch — nothing fires them on a push.
  VEIL_SDK_SCRIPT_PIN: 'c7506a36edb69d307663adc9d9717b527db113f0'
  # Copied verbatim from the published manifest's `gn_args` — see the same
  # block in webrtc-linux.yml for why the argument list is pinned here.
  WEBRTC_GN_ARGS_WIN: 'enable_libaom = false is_component_build = false is_debug = false rtc_build_examples = false rtc_build_tools = false rtc_enable_protobuf = false rtc_include_opus = true rtc_include_tests = false rtc_use_h264 = false symbol_level = 0 target_cpu = "x64" target_os = "win" treat_warnings_as_errors = false'
  # Same line, arm64. Kept as its own variable rather than built by string
  # surgery, so what a bundle is checked against is a literal.
  WEBRTC_GN_ARGS_WIN_ARM64: 'enable_libaom = false is_component_build = false is_debug = false rtc_build_examples = false rtc_build_tools = false rtc_enable_protobuf = false rtc_include_opus = true rtc_include_tests = false rtc_use_h264 = false symbol_level = 0 target_cpu = "arm64" target_os = "win" treat_warnings_as_errors = false'

jobs:
  engine-windows:
    name: veil_media.dll (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            gn_args_var: WEBRTC_GN_ARGS_WIN
          - target: win-arm64
            gn_args_var: WEBRTC_GN_ARGS_WIN_ARM64
    # Was 350, for a job that spent fifty-eight of its sixty-five minutes
    # building WebRTC. What is left is a 158 MB download, an extract and an
    # eighteen-second wrapper build; Windows gets a little more room than the
    # linux jobs because its checkout, its unzip and its virus scanner are all
    # slower than their linux equivalents.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      # `Reclaim disk` (5m 03s of deleting preinstalled SDKs), the pinned
      # depot_tools with its hand-run `bootstrap\win_tools.bat`, `fetch` +
      # `gclient sync` and `ninja webrtc` all stood here. They are gone with the
      # 33 GB checkout they existed to produce.
      #
      # The git.bat lesson they encoded is not lost — it is written up in
      # veilnetwork/libwebrtc-builds' README and lives in the job there that
      # still does the from-source build, plus this repository's own history at
      # 1b7f946. Nothing on this route calls depot_tools at all.
      #
      # bash, on Windows, deliberately: fetch-sdk.sh is ONE consumer script for
      # every target, and the alternative is a second implementation of the pin
      # check in PowerShell — which is how two checks come to disagree. Git for
      # Windows' bash is on every runner. Its Windows branch (cygpath, then
      # setup.ps1 through powershell.exe) is the part of that script this job is
      # the first ever to execute, which is why it opens by naming the tools it
      # is about to depend on instead of failing in the middle of one.
      # A target nobody asked for must not fail the run: the arm64 SDK is
      # published separately, and a run aimed at x64 must not depend on it.
      - name: Skip targets not asked for
        id: want
        shell: bash
        run: |
          if echo "${{ inputs.targets }}" | grep -qw "${{ matrix.target }}"; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.target }} was not requested"
          fi

      - name: WebRTC SDK for ${{ matrix.target }}
        if: steps.want.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          echo "== tools fetch-sdk.sh needs on this runner"
          for t in curl python3 unzip cygpath powershell.exe; do
            printf '  %-14s %s\n' "$t" "$(command -v "$t" 2>/dev/null || echo 'MISSING')"
          done
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/fetch-sdk.sh" \
            "https://raw.githubusercontent.com/$VEIL_SDK_REPO/$VEIL_SDK_SCRIPT_PIN/scripts/fetch-sdk.sh"
          # RUNNER_TEMP is a Windows path; give bash a POSIX one, and let
          # fetch-sdk.sh hand back the Windows form through cygpath -w, which
          # is what clang-cl and lld-link can actually open.
          into="$(cygpath -u "$RUNNER_TEMP")/webrtc-sdk"
          # See webrtc-linux.yml for why this is not `eval "$(fetch-sdk.sh …)"`.
          bash "$RUNNER_TEMP/fetch-sdk.sh" --target ${{ matrix.target }} \
            --expect-pin "$WEBRTC_PIN" --into "$into" \
            > "$RUNNER_TEMP/sdk-env.sh"
          cat "$RUNNER_TEMP/sdk-env.sh"
          eval "$(cat "$RUNNER_TEMP/sdk-env.sh")"
          # fetch-sdk.sh prints WEBRTC_SRC through `cygpath -w`, because that is
          # what clang-cl has to open, but WEBRTC_BUILD — the bundle root — in
          # bash's own form, /d/a/_temp/…. Every step after this one is
          # PowerShell, where that reads as \d\a\_temp\… and Test-Path answers
          # no. Convert it here rather than teaching each consumer both spellings.
          WEBRTC_BUILD="$(cygpath -w "$WEBRTC_BUILD")"
          for v in WEBRTC_SRC WEBRTC_OUT WEBRTC_BUILD; do
            [ -n "${!v:-}" ] || { echo "::error::fetch-sdk.sh printed no $v"; exit 1; }
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      # The second pin check, in PowerShell rather than bash because every path
      # here is a Windows path from here on. Same job as its twin in
      # webrtc-linux.yml: fetch-sdk.sh compares against the PUBLISHED manifest
      # before downloading; this compares against the manifest inside the
      # extract, before a single translation unit is compiled.
      - name: The bundle is the WebRTC these sources expect
        if: steps.want.outputs.run == 'yes'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:WEBRTC_BUILD 'veil-webrtc-sdk.json'
          if (-not (Test-Path $manifest)) { throw "no $manifest - no bundle was laid out" }
          $m = Get-Content -Raw $manifest | ConvertFrom-Json
          Write-Host "bundle: target=$($m.target) webrtc=$($m.webrtc_pin) out=$($m.out_dir)"
          if ($m.webrtc_pin -ne $env:WEBRTC_PIN) {
            Write-Host "::error::this bundle was built from WebRTC $($m.webrtc_pin); these sources expect $env:WEBRTC_PIN"
            exit 1
          }
          if ($m.target -ne '${{ matrix.target }}') {
            Write-Host "::error::this bundle is for $($m.target); this job builds ${{ matrix.target }}"
            exit 1
          }
          # The pin says WHICH WebRTC; this says HOW it was configured. Same
          # check as the two linux jobs, same reason.
          $expectedGn = [Environment]::GetEnvironmentVariable('${{ matrix.gn_args_var }}')
          if ($m.gn_args -ne $expectedGn) {
            Write-Host "::error::the bundle's gn args are not the ones this repository expects"
            Write-Host "  bundle:   $($m.gn_args)"
            Write-Host "  expected: $expectedGn"
            exit 1
          }
          $cc = Join-Path (Join-Path $env:WEBRTC_SRC $env:WEBRTC_OUT) 'compile_commands.json'
          if (-not (Test-Path $cc)) { throw "no $cc - setup.ps1 did not run, or the bundle is incomplete" }
          $entries = Get-Content -Raw $cc | ConvertFrom-Json
          $call = $entries | Where-Object { $_.file -replace '\\', '/' -like '*call/call.cc' } | Select-Object -First 1
          if (-not $call) {
            Write-Host "::error::$cc has no call/call.cc entry - the wrapper build compiles every veil TU with that exact command"
            exit 1
          }
          $lib = Join-Path (Join-Path $env:WEBRTC_SRC $env:WEBRTC_OUT) 'obj\webrtc.lib'
          if (-not (Test-Path $lib)) { throw "no $lib in the bundle" }
          Write-Host "webrtc.lib: $((Get-Item $lib).Length) bytes"

      - name: Build veil_media.dll
        if: steps.want.outputs.run == 'yes'
        shell: pwsh
        env:
          VEIL_MEDIA_NO_STRIP: ${{ inputs.keep_symbols && '1' || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          # lld-link resolves Microsoft's import libraries by BARE NAME out of
          # LIB - msvcprt/libcpmt for the C++ runtime, mfplat/mf/mfreadwrite for
          # the camera, gdi32/user32 for the screen capturer - and nothing in
          # the bundle claims to provide them. A Developer PowerShell sets LIB;
          # a plain runner shell may not. Build the same list from vswhere when
          # it is missing, so that a link failure means the link is wrong rather
          # than that this ran in a bare shell. This is the recipe
          # libwebrtc-builds' own verify-sdk.ps1 proved on a runner.
          Write-Host "==> LIB was: $(if ($env:LIB) { $env:LIB } else { '(unset)' })"
          if (-not $env:LIB) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (-not (Test-Path $vswhere)) { throw "LIB is unset and there is no vswhere at $vswhere to rebuild it from" }
            $vs = & $vswhere -latest -products * -property installationPath 2>$null | Select-Object -First 1
            $tools = if ($vs) {
              Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending | Select-Object -First 1
            }
            $kits = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots' -ErrorAction SilentlyContinue).KitsRoot10
            $libs = @()
            if ($tools) { $libs += (Join-Path $tools.FullName 'lib\x64') }
            if ($kits) {
              $sdk = Get-ChildItem (Join-Path $kits 'Lib') -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like '10.*' } | Sort-Object Name -Descending | Select-Object -First 1
              if ($sdk) {
                foreach ($part in @('um\x64', 'ucrt\x64')) {
                  $p = Join-Path $sdk.FullName $part
                  if (Test-Path $p) { $libs += $p }
                }
              }
            }
            if (-not $libs) { throw 'LIB is unset and vswhere found no MSVC or Windows SDK lib directory' }
            $env:LIB = $libs -join ';'
            Write-Host "==> LIB set to: $env:LIB"
          }
          & third_party\veil\flutter\veil_media\windows\build_veil_media_dll_windows.ps1 `
            -WebrtcSrc "$env:WEBRTC_SRC" `
            -WebrtcOut "$env:WEBRTC_OUT" `
            -Dest "$env:GITHUB_WORKSPACE\engine-out"
          # The ARTIFACT, not the exit code - the same rule the depot_tools
          # bootstrap was made to follow.
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\engine-out\veil_media.dll")) {
            throw 'the wrapper build reported success and produced no veil_media.dll'
          }

      # The reason webrtc-linux exists at all applies here unchanged: an engine
      # short of the symbols Dart looks up links, bundles, and fails at the
      # first call. check-media-symbols.sh reads ELF, so the export table comes
      # from dumpbin here and the comparison is done in place.
      - name: Every symbol Dart looks up is exported
        if: steps.want.outputs.run == 'yes'
        shell: pwsh
        run: |
          $dll = "$env:GITHUB_WORKSPACE\engine-out\veil_media.dll"
          $dumpbin = Get-ChildItem -Recurse -Filter dumpbin.exe `
            -Path "${env:ProgramFiles(x86)}\Microsoft Visual Studio", "$env:ProgramFiles\Microsoft Visual Studio" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $exported = & $dumpbin.FullName /EXPORTS $dll |
            Select-String -Pattern '\bveil_media_[a-z0-9_]+' -AllMatches |
            ForEach-Object { $_.Matches.Value } | Sort-Object -Unique
          # Quoted names only, mirroring check-media-symbols.sh: the bare
          # identifier also appears inside library names, and a check that
          # invents a missing symbol is a check someone switches off.
          # Get-ChildItem -Recurse, not a ** in -Path: PowerShell has no
          # recursive glob, it treats ** as a single *. That happens to find
          # all 87 names today only because they all sit in one file two
          # levels down; move it deeper and the gate would go on passing while
          # checking nothing.
          $dartFiles = Get-ChildItem -Recurse -File -Filter *.dart -Path `
            "$env:GITHUB_WORKSPACE\lib", `
            "$env:GITHUB_WORKSPACE\third_party\veil\flutter\veil_media\lib"
          # -CaseSensitive, because Select-String is not by default and grep is:
          # check-media-symbols.sh has always been case-sensitive, so the ELF
          # platforms never saw this. Without it the lowercase pattern matches
          # VEIL_MEDIA_DYLIB - the env var native.dart reads to override the
          # library path - and the check demands the engine export it.
          $looked = $dartFiles |
            Select-String -Pattern "'(veil_media_[a-z0-9_]+)'" -AllMatches -CaseSensitive |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } |
            Sort-Object -Unique
          # A gate that finds nothing to check passes trivially, which is the
          # failure mode of every check keyed on discovery. 87 names today.
          if ($looked.Count -lt 50) {
            Write-Host "::error::found only $($looked.Count) veil_media_* lookups in the Dart tree - discovery is broken, not the engine"
            exit 1
          }
          # These two are thunks into veilclient_ffi.dll and deliberately not
          # exported - see veil_win_datagram_thunk.cc.
          $looked = $looked | Where-Object { $_ -notin @('veil_media_send_datagram', 'veil_media_set_recv_callback') }
          $missing = $looked | Where-Object { $_ -notin $exported }
          Write-Host "exported: $($exported.Count), looked up: $($looked.Count)"
          # Recorded for the provenance asset. Written before the verdict, not
          # instead of it: the exit below is untouched, so a short engine still
          # kills the job and nothing reaches the release.
          "PE: exported $($exported.Count)   looked up by Dart: $($looked.Count)" |
            Set-Content -Path "$env:GITHUB_WORKSPACE\symbol-check.txt" -Encoding utf8
          if ($missing) {
            Write-Host "::error::the engine does not export: $($missing -join ', ')"
            exit 1
          }

      # An asset with no provenance is the pinned-run problem in a nicer
      # wrapper. Written by the job that knows what it actually used.
      - name: Provenance for the ${{ matrix.target }} asset
        if: steps.want.outputs.run == 'yes'
        shell: pwsh
        env:
          KEEP_SYMBOLS: ${{ inputs.keep_symbols }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = "$env:GITHUB_WORKSPACE\engine-out\veil_media.dll"
          $sha = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLower()
          $size = (Get-Item $dll).Length
          $veil = (& git -C third_party\veil rev-parse HEAD).Trim()
          $check = (Get-Content "$env:GITHUB_WORKSPACE\symbol-check.txt" -Raw).Trim()
          $stripped = if ($env:KEEP_SYMBOLS -eq 'true') { 'no' } else { 'yes' }
          # depot_tools is no longer OURS to record: this job does not run it.
          # These come out of the bundle's manifest, so they describe what built
          # the webrtc.lib actually inside this DLL.
          $m = Get-Content -Raw (Join-Path $env:WEBRTC_BUILD 'veil-webrtc-sdk.json') | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path provenance | Out-Null
          $lines = @(
            "asset:           veil_media-${{ matrix.target }}.dll"
            "installs-as:     veil_media.dll"
            "sha256:          $sha"
            "size:            $size bytes"
            "built:           $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
            "webrtc:          $env:WEBRTC_PIN"
            "webrtc-sdk:      $env:VEIL_SDK_REPO webrtc-$env:WEBRTC_PIN veil-webrtc-sdk-${{ matrix.target }}.zip"
            "webrtc.lib:      sha256 $($m.libwebrtc_sha256) ($($m.libwebrtc_bytes) bytes)"
            "sdk-built-by:    $($m.built_by)"
            "depot_tools:     $($m.depot_tools_pin) (the SDK's, recorded by the run that built webrtc.lib)"
            "clang:           $($m.clang_revision)"
            "xveil-commit:    $env:GITHUB_SHA"
            "veil-submodule:  $veil"
            "workflow:        webrtc-windows.yml (job: engine-windows)"
            "run:             $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "stripped:        $stripped"
            "symbol-check:    $check"
          )
          # ASCII, not PowerShell's default UTF-16: this file is read on a Linux
          # runner and by anyone who downloads it, and a BOM'd UTF-16 text file
          # reads as binary garbage there.
          #
          # And LF, not Set-Content's CRLF, for the same reason one line lower
          # down than the encoding. The record is parsed with
          # `awk '/^sha256:/{print $2}'`, and under CRLF that field comes back
          # 65 characters long — the hash plus a carriage return — so the
          # release job's `[ "$want" = "$got" ]` compares unequal against a
          # byte-identical DLL and refuses it with "the downloaded engine is
          # not the one its provenance describes". Measured on the first
          # published win-x64 record: want 65, got 64, hashes visually the same
          # because the CR returns the cursor before the difference can show.
          # WriteAllText is used because Set-Content has no line-ending switch.
          [IO.File]::WriteAllText(
            (Join-Path (Get-Location) "provenance\veil_media-${{ matrix.target }}.dll.provenance"),
            (($lines -join "`n") + "`n"),
            [Text.Encoding]::ASCII)
          Get-Content "provenance\veil_media-${{ matrix.target }}.dll.provenance"

      # Unchanged: the old run-id route still reads this artifact, by this
      # name, expecting exactly this one file.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.want.outputs.run == 'yes'
        with:
          name: libveil_media-${{ matrix.target }}
          path: engine-out/veil_media.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.want.outputs.run == 'yes'
        with:
          name: libveil_media-${{ matrix.target }}-provenance
          path: provenance/veil_media-${{ matrix.target }}.dll.provenance
          if-no-files-found: error

  # THE ONLY JOB HERE THAT CAN WRITE — same split as webrtc-linux.yml and for
  # the same reason (audit X-08). The build job above executes a script and a
  # toolchain fetched from another repository under a read-only token; this one
  # downloads two artifacts and uploads them, and runs nothing from outside
  # this repository.
  #
  # On ubuntu, not windows: it does not touch the DLL, and a Windows runner for
  # two downloads and an upload is a slower, more expensive way to do the same
  # thing in a second shell dialect.
  publish:
    name: attach to the engine release
    needs: [engine-windows]
    if: ${{ !cancelled() && inputs.publish_release && needs['engine-windows'].result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: The release this run attaches to
        id: tag
        env:
          REQUESTED: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED:-}"
          [ -n "$tag" ] || tag="engine-$(date -u +%Y.%m.%d)"
          # See webrtc-linux.yml: engine releases share a tag namespace with the
          # app's own vX.Y.Z releases, and a mistyped tag would staple a DLL
          # onto a user-facing release rather than fail.
          case "$tag" in
            engine-*) ;;
            *) echo "::error::release_tag must start with 'engine-' (got '$tag'). Engine releases share this repository with the app's vX.Y.Z releases."; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "attaching to release $tag"

      # One directory per target. `merge-multiple` into a shared one was fine
      # while there was a single target; both artifacts carry a file called
      # veil_media.dll, so merging them now would land one on top of the other
      # and publish whichever won under both names.
      - name: win-x64 engine and its provenance
        if: contains(inputs.targets, 'win-x64')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: libveil_media-win-x64*
          path: incoming/win-x64
          merge-multiple: true

      - name: win-arm64 engine and its provenance
        if: contains(inputs.targets, 'win-arm64')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: libveil_media-win-arm64*
          path: incoming/win-arm64
          merge-multiple: true

      # veil_media-win-x64.dll, not libveil_media-win-x64.dll: the Windows
      # engine has never carried the lib prefix, and this name is not
      # free-form — scripts/xveil_native_deps.py looks for it by exact string.
      - name: Stage the assets under their published names
        run: |
          set -euo pipefail
          mkdir -p dist
          staged=0
          for t in win-x64 win-arm64; do
            [ -d "incoming/$t" ] || continue
            cp "incoming/$t/veil_media.dll" "dist/veil_media-$t.dll"
            cp "incoming/$t/veil_media-$t.dll.provenance" dist/
            staged=$((staged + 1))
          done
          # A publish job that stages nothing would attach an empty release and
          # report success.
          [ "$staged" -gt 0 ] || { echo "::error::no target produced an engine to publish"; exit 1; }
          ls -la dist/
          sha256sum dist/*.dll

      - name: Refuse to change what an existing pin means
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPLACE: ${{ inputs.replace_assets }}
        run: |
          set -euo pipefail
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                        --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            echo "release $TAG carries no assets yet — nothing can be clobbered"
            exit 0
          fi
          echo "release $TAG already carries:"; echo "$existing" | sed 's/^/  /'
          clash=0
          for staged in dist/*; do
            name="$(basename "$staged")"
            if grep -qxF -- "$name" <<< "$existing"; then
              echo "  CLASH: $name is already published under $TAG"
              clash=1
            fi
          done
          if [ "$clash" = 1 ] && [ "$REPLACE" != "true" ]; then
            echo "::error::$TAG already carries assets this run would replace. Anything already pinned to $TAG would change meaning without its pin changing. Either dispatch again with a fresh release_tag, or set replace_assets=true if you are deliberately correcting a bad upload."
            exit 1
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: call engine ${{ steps.tag.outputs.tag }}
          # Build inputs, not a user download — see webrtc-linux.yml.
          prerelease: true
          # This run is usually the SECOND one against this tag (linux first,
          # windows after). Appending adds this block instead of overwriting
          # what the linux run wrote.
          append_body: true
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          # Repeats the one-line pointer rather than assuming the linux run
          # already wrote the preamble: windows can be the first run against a
          # tag, and a release whose body is a bare table explains nothing.
          body: |
            ### From webrtc-windows.yml

            Prebuilt call engine — a build input, not a download for users. The
            sibling `.provenance` asset is the authoritative record.

            | | |
            |---|---|
            | WebRTC pin | `${{ env.WEBRTC_PIN }}` |
            | WebRTC SDK | `${{ env.VEIL_SDK_REPO }}` @ `webrtc-${{ env.WEBRTC_PIN }}` |
            | xVeil commit | `${{ github.sha }}` |
            | built by | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |

            Consumed by pinning `ENGINE_RELEASE: '${{ steps.tag.outputs.tag }}'`
            in the `windows` job of `.github/workflows/release.yml`.
