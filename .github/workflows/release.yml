name: release

# A tag runs the checks and THEN builds the artifacts, in that order and only
# in that order. `run_checks` still exists, but it can only turn the checks off
# on a manual dispatch, and that path cannot reach `publish`.
#
# Building on a runner also keeps the builder's home directory out of the
# binaries. `libapp.so` carries the absolute path of the Flutter plugin
# registrant and there is no remap flag for it, so a laptop build always names
# its owner; `/home/runner/work/...` does not.
#
# macOS and iOS are absent on purpose: without an Apple signing identity
# Gatekeeper refuses the result outright, so the build would produce something
# nobody can run. Windows has no such gate — see the SmartScreen note there.
#
# Every platform here carries one thing this job cannot build: the call engine
# is a prebuilt libveil_media, and producing it needs a from-source WebRTC
# checkout — hours and tens of GB, more than a release job should hold. The
# webrtc-linux and webrtc-windows workflows make it by hand and this one pins
# what they produced.
#
# TWO ROUTES, and which one a job takes is decided by which variable is set,
# never by which download happened to work:
#
#   ENGINE_RELEASE — a GitHub Release tag. Preferred. Release assets on a
#     public repository never expire and download with no credential at all.
#   ENGINE_RUN — a workflow run id, whose ARTIFACTS expire on a fixed date and
#     need a token even here. This is the old route, kept working so the switch
#     is per-platform rather than a flag day.
#
# A job with ENGINE_RELEASE set does NOT fall back to ENGINE_RUN when the
# release download fails. A silent fallback would answer "the durable pin is
# broken" by quietly building against an older engine, which is the exact
# stale-prebuilt failure this repository keeps paying for. scripts/
# xveil_native_deps.py makes the same choice in the same order, so a laptop and
# CI cannot disagree about which engine they are building against.
#
# Whichever route delivers it, the engine is then checked against the symbols
# Dart looks up, from OUTSIDE the branch that fetched it — the copy this
# replaced was twelve commits behind and would have failed at dlsym on the
# first call, and a new download path must not be a way around that.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      run_checks:
        description: >-
          Run analyze + the Dart suite. Tags always do; a manual dispatch may
          skip it, and then it cannot publish.
        required: false
        type: boolean
        default: false

# LEAST PRIVILEGE, per job (audit X-08). This used to be a workflow-wide
# `contents: write`, so every job held a token that can push to the repository
# and create releases — including the three build jobs, which run gradle,
# flutter pub and depot_tools, i.e. thousands of lines of third-party build
# script. Only `publish` attaches anything, so only `publish` gets the write.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.0'
  # Pinned rather than tracking master: this checkout ends up inside a shipped
  # library, and an unpinned dependency is a supply-chain decision made by
  # whoever pushed to it last.
  WHISPER_REPO: 'https://github.com/ggml-org/whisper.cpp.git'
  WHISPER_COMMIT: '7695a5331230c585f5ce92291c4256973985ae5a'
  # Where the engine RELEASES live, spelled out rather than taken from
  # github.repository. A fork's releases are its own and it has never run the
  # five-hour WebRTC build, so a fork resolving its own name would 404 on
  # something it was never going to have. Release assets are public, so
  # fetching upstream's needs no credential and no arrangement — which is the
  # whole reason this route exists. Same constant as UPSTREAM in
  # scripts/xveil_native_deps.py.
  ENGINE_REPO: 'veilnetwork/xVeil'

jobs:
  # THE GATE. A tag runs it unconditionally, and nothing is built until it is
  # green.
  #
  # It used to be opt-in — `if: workflow_dispatch && inputs.run_checks` — and no
  # build job depended on it either way, so pushing a tag went straight to
  # building and drafting a release without `analyze` or the suite having run
  # ONCE against that commit and those submodule pointers. The stated reasoning
  # was that the local pre-tag gate had already proved it. A local gate proves
  # whatever was in somebody's working tree, which is not the tagged tree, and
  # says nothing whatever about what `submodules: recursive` resolves to here —
  # and third_party/veil and third_party/hidden-volume are where most of the
  # behaviour lives.
  #
  # A manual dispatch may still skip it (`run_checks: false`), for re-running a
  # build whose artifacts expired. That path is fenced off from `publish`, which
  # requires this job to have actually SUCCEEDED rather than merely not failed.
  checks:
    name: analyze + tests
    if: github.event_name != 'workflow_dispatch' || inputs.run_checks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: android APKs
    # `!cancelled()` rather than the implicit `success()`: it is what lets the
    # deliberate manual skip through (a skipped `checks` is not a failed one)
    # while a RED `checks` still stops the build dead.
    needs: checks
    if: ${{ !cancelled() && needs.checks.result != 'failure' }}
    timeout-minutes: 75
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Rust with the Android targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # i686 is here only because hidden-volume's build-android.sh checks
          # for all four targets up front, even when asked for three ABIs.
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      # The targets above land on the toolchain THIS action installs, which is
      # `stable`. The build below runs in third_party/hidden-volume, and that
      # directory has a rust-toolchain.toml pinning 1.97.1 with
      # `targets = ["aarch64-linux-android", "x86_64-pc-windows-gnu"]` — so
      # rustup switches toolchains on entering it and three of the four targets
      # are simply not there. The job failed with
      # `missing Rust targets: armv7-linux-androideabi x86_64-linux-android
      # i686-linux-android` while the step above had named all four, which
      # reads as the action having ignored its own input.
      #
      # So they are added again HERE, from inside that directory, where rustup
      # resolves the pinned toolchain and puts them where the build will look.
      # Same defect and same fix as veil's Windows gate, which lost its
      # aarch64 leg to this for a week, and as mobile-build.yml, which already
      # carries this step with a comment saying why.
      - name: Android targets on the pinned toolchain
        working-directory: third_party/hidden-volume
        run: |
          set -euo pipefail
          rustup show active-toolchain
          for t in aarch64-linux-android armv7-linux-androideabi \
                   x86_64-linux-android i686-linux-android; do
            rustup target add "$t"
          done
          # Assert rather than trust: `target add` is a no-op on an unknown
          # name in some rustup versions, and the build's own preflight is the
          # thing this exists to satisfy.
          installed="$(rustup target list --installed)"
          for t in aarch64-linux-android armv7-linux-androideabi \
                   x86_64-linux-android i686-linux-android; do
            grep -qx "$t" <<< "$installed" || {
              echo "::error::$t still missing from the pinned toolchain"; exit 1; }
          done

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      # The runner image already carries a complete NDK. Downloading another
      # one gave a tree whose clang was missing at the path cmake was told to
      # use, and cmake only says so after configuring — hence the explicit
      # check here rather than a failure three steps later.
      - name: Android NDK
        id: ndk
        run: |
          set -euo pipefail
          p="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$p" ] || [ ! -d "$p" ]; then
            p="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          cc="$p/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          if [ ! -x "$cc" ]; then
            echo "::error::no usable NDK clang at $cc"
            ls -la "$ANDROID_HOME/ndk" 2>/dev/null || true
            exit 1
          fi
          echo "using NDK $p"
          echo "path=$p" >> "$GITHUB_OUTPUT"

      - name: whisper.cpp at the pinned commit
        run: |
          set -euo pipefail
          git init whisper.cpp
          cd whisper.cpp
          git remote add origin "$WHISPER_REPO"
          git fetch --depth 1 origin "$WHISPER_COMMIT"
          git checkout FETCH_HEAD

      # -ffile-prefix-map here and --remap-path-prefix below: rustc and the C
      # compiler each bake their own source paths into the binary, and neither
      # flag covers the other. A release APK once carried the builder's account
      # name 213 times because only one of the two was set.
      - name: whisper static libs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.path }}
        run: |
          set -euo pipefail
          cd whisper.cpp
          # One tree per ABI. build_veil_whisper_android.sh looks for
          # build-android-<abi>, and the ABI, the build directory and the
          # jniLibs destination are one choice written three ways — picking
          # them apart is how an arm64 library lands in the x86_64 folder.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "==> whisper.cpp for $abi"
            cmake -B "build-android-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-26 \
              -DGGML_METAL=OFF -DBUILD_SHARED_LIBS=OFF \
              -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=OFF \
              -DCMAKE_C_FLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=/src" \
              -DCMAKE_CXX_FLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=/src"
            cmake --build "build-android-$abi" -j "$(nproc)"
          done

      # gradle's cargo-ndk task builds veilclient_ffi during `flutter build`,
      # but hidden-volume ships a PREBUILT .so in jniLibs that nothing
      # regenerates — locally that library sat four days stale without a word
      # in any build log. Build it explicitly so CI cannot inherit that.
      - name: hidden-volume cdylib
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.path }}
          CARGO_BUILD_RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src
          CFLAGS: -ffile-prefix-map=${{ github.workspace }}=/src
          CXXFLAGS: -ffile-prefix-map=${{ github.workspace }}=/src
        working-directory: third_party/hidden-volume
        run: ABIS="arm64-v8a armeabi-v7a x86_64" PROFILE=release ./scripts/build-android.sh

      # assets/prod/obfs4_psk.b64 is gitignored — it is a network secret — so a
      # fresh checkout has the directory without it, pubspec bundles what is
      # there, and the build succeeds. The app then calls
      # _loadBundledObfs4Psk(), catches the missing asset and returns null to
      # "degrade gracefully": it starts, looks healthy, and silently cannot
      # complete an obfs4 handshake with any production seed. The first CI APK
      # shipped exactly that.
      #
      # Not a downgrade in secrecy: this key is deployment-wide and travels
      # inside every APK handed to anyone, so a repository secret holds nothing
      # the artifact does not already carry.
      - name: Production obfs4 PSK
        env:
          PSK: ${{ secrets.PROD_OBFS4_PSK }}
        run: |
          set -euo pipefail
          if [ -z "$PSK" ]; then
            echo "::error::PROD_OBFS4_PSK is not set — the APK would build, install, run and never reach the network."
            exit 1
          fi
          printf '%s\n' "$PSK" > assets/prod/obfs4_psk.b64

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — gradle would fall back to the debug key and produce an APK that can never be updated over."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          umask 077
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      # Android needs the same out-of-band prebuilt Linux does, and nobody
      # wired it: libveil_media.so is gitignored, so a clean checkout has none,
      # gradle packaged the ABI directories that existed and the build went
      # green. v0.9.1 shipped that way — its arm64 APK carried eleven native
      # libraries and no media engine, and the app installed, started and threw
      # 'library libveil_media.so not found' the first time anyone recorded a
      # voice message. Same pin-a-run mechanism as the linux job below.
      - name: Prebuilt call engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # THE DURABLE PIN. Set this to the engine release tag once the
          # android engine has been published to one — webrtc-linux.yml's
          # publish job prints the exact line to paste. It takes precedence
          # over ENGINE_RUN below, and once it is set the run id is dead
          # weight kept only for the record.
          #
          # FILLED 2026-08-13. Release `engine-2026.08.13`, published by
          # webrtc-linux run 31696608908 — the first run to attach the engine
          # to a Release instead of leaving it as a run artifact.
          #
          # Verified the way a consumer gets it, not by the green tick: fetched
          # with plain curl and NO credential (HTTP 200), a real x86-64 ELF
          # shared object, 87 exported symbols — the same 87 the gate below
          # looks up. Its `.provenance` sidecar records the WebRTC and
          # depot_tools pins, the xVeil commit and the veil submodule commit it
          # was built from.
          #
          # Release assets do not expire. The ENGINE_RUN below is kept as the
          # fallback route and as the record of where this came from, but it is
          # no longer what a tag depends on.
          # MOVED 2026-08-28 to `engine-2026.08.28.2`. The 08.13 release
          # carries ONE android engine, arm64 — it predates the ABIs. This
          # release carries all three, each verified against its own provenance
          # and, below, against its own ELF machine type.
          ENGINE_RELEASE: 'engine-2026.08.28.2'
          # webrtc-linux run 31609030118 (12 August), the FIRST run whose
          # engine-android job ever finished. Every earlier run carried
          # libveil_media-linux-x64 and nothing else, so there was no android
          # id to pin rather than a forgotten one — the job died in WebRTC's
          # Java dep validation ("AUTONINJA_BUILD_ID is not set"), which reads
          # like a broken runner and is really a gn argument
          # (android_static_analysis="off", fixed in webrtc-linux.yml).
          #
          # Verified by asking the API for that run's artifact list, not by
          # reading the green tick: libveil_media-android-arm64, 2227014 bytes,
          # and the job's own check reports 87 exported / 87 looked up by Dart.
          #
          # THIS ARTIFACT EXPIRES on 2026-11-10. That is the date this pin
          # becomes a dead link and the recovery becomes a 43-minute run.
          ENGINE_RUN: '31609030118'
        run: |
          set -euo pipefail
          # One engine per shipped ABI. The asset name and the jniLibs
          # directory are the same choice written twice, so they are named
          # together here rather than derived apart.
          abis="arm64-v8a:libveil_media-android-arm64.so armeabi-v7a:libveil_media-android-arm.so x86_64:libveil_media-android-x64.so"
          if [ -z "${ENGINE_RELEASE:-}" ] && [ -n "${ENGINE_RUN:-}" ]; then
            echo "::error::the run-artifact route only ever carried arm64. Set ENGINE_RELEASE to a tag that has all three engines."
            exit 1
          fi
          [ -n "${ENGINE_RELEASE:-}" ] || {
            echo "::error::ANDROID call engine is not pinned. Run the webrtc-linux workflow (engine-android job) and set ENGINE_RELEASE here to the tag its publish job attached to. Without it the APK builds and cannot do voice messages, video notes, calls or speech-to-text."
            exit 1
          }
          echo "engine: release $ENGINE_RELEASE from $ENGINE_REPO (no credential)"
          base="$GITHUB_SERVER_URL/$ENGINE_REPO/releases/download/$ENGINE_RELEASE"
          for pair in $abis; do
            abi="${pair%%:*}"; asset="${pair#*:}"
            dest="android/app/src/main/jniLibs/$abi"
            mkdir -p "$dest"
            # Into RUNNER_TEMP, not into dest: everything in a jniLibs ABI
            # directory is a candidate for packaging into the APK, and the
            # provenance record is documentation, not a native library.
            prov="$RUNNER_TEMP/$asset.provenance"
            curl -fL --retry 3 --retry-delay 5 --max-time 300 -o "$dest/libveil_media.so" "$base/$asset"
            curl -fL --retry 3 --retry-delay 5 --max-time 60 -o "$prov" "$base/$asset.provenance"
            echo "--- provenance ($abi) ---"; cat "$prov"; echo "-------------------------"
            # tr -d '\r': a provenance written on a Windows runner arrives
            # CRLF, and awk hands back the hash with a carriage return glued to
            # it, so this compares unequal against a byte-identical file. The
            # producer writes LF now; this strips it anyway, because the record
            # travels and the next one may come from a host that does not.
            want="$(awk '/^sha256:/{print $2}' "$prov" | tr -d '\r')"
            got="$(sha256sum "$dest/libveil_media.so" | cut -d' ' -f1)"
            [ -n "$want" ] || { echo "::error::$asset.provenance carries no sha256 line — it is not the record it claims to be"; exit 1; }
            [ "$want" = "$got" ] || { echo "::error::the downloaded $abi engine is not the one its provenance describes (recorded $want, got $got)"; exit 1; }
            # The name says which ABI; the file says which ABI. A published
            # asset that disagrees with its own name would install cleanly and
            # fail at dlopen on a device, which is the last place to find out.
            machine="$(python3 -c 'import struct,sys; d=open(sys.argv[1],"rb").read(20); print(hex(struct.unpack("<H", d[18:20])[0]))' "$dest/libveil_media.so")"
            case "$abi:$machine" in
              arm64-v8a:0xb7|armeabi-v7a:0x28|x86_64:0x3e) : ;;
              *) echo "::error::$asset is ELF e_machine $machine, which is not $abi"; exit 1 ;;
            esac
            echo "sha256 matches the published provenance; ELF machine $machine is $abi"
            ls -la "$dest/libveil_media.so"
            # OUTSIDE any fetch branch, deliberately. This is the check that
            # caught an engine twelve commits behind, and a new way of fetching
            # the file must not also be a new way around it.
            bash scripts/check-media-symbols.sh "$dest/libveil_media.so"
          done

      # builder.py is the same entry point used by hand, so CI and a laptop
      # cannot drift: it sets the path-remap environment, runs the whisper
      # wrapper, builds the arm64 APK and fails if the signing key is absent
      # or the call engine is not staged.
      - name: Build the APKs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.path }}
          NDK: ${{ steps.ndk.outputs.path }}
          WHISPER_SRC: ${{ github.workspace }}/whisper.cpp
        run: python3 builder.py android --release

      # Check the artifact, not the step that made it. Writing the file before
      # the build proves nothing about what pubspec picked up, and the failure
      # mode here is an app that runs and cannot connect — invisible from any
      # build log.
      - name: The APKs carry the PSK
        run: |
          set -euo pipefail
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            if ! unzip -l "$apk" | grep -q 'assets/prod/obfs4_psk.b64'; then
              echo "::error::$apk has no bundled PSK — it cannot reach the production network"
              exit 1
            fi
            echo "  ok $(basename "$apk")"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  linux:
    name: linux bundle (${{ matrix.arch }})
    needs: checks
    if: ${{ !cancelled() && needs.checks.result != 'failure' }}
    timeout-minutes: 60
    # One job per architecture rather than two copies of a hundred and eighty
    # lines: the only differences are the runner, which engine asset to fetch,
    # and what the archive is called. GitHub's arm64 runners are free for a
    # public repository, which this is.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            engine_asset: libveil_media-linux-x64.so
          - arch: arm64
            runner: ubuntu-24.04-arm
            engine_asset: libveil_media-linux-arm64.so
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      # From prepare.py's LINUX_PACKAGES. libayatana-appindicator3-dev is for
      # tray_manager, which stops the CMake configure with a message naming a
      # pkg-config module and no package.
      # Bounded on purpose. Unqualified, this step wedged the v0.11.0 release
      # for an hour and fifty-two minutes on its first line: the runner image
      # runs unattended-upgrades, apt waits on the dpkg lock forever by
      # default, and a package that wants to ask something has no terminal to
      # ask on. DPkg::Lock::Timeout bounds the wait, DEBIAN_FRONTEND answers
      # for it, and the retry covers a mirror that is briefly unreachable.
      # Twenty-five minutes, and recommends left on. Both numbers are paid for.
      # The ceiling is a backstop, not the defence -- DPkg::Lock::Timeout turns
      # the lock hang into an error in three minutes regardless -- so it only
      # has to outlast a slow mirror, and a sibling repository measured sixteen
      # minutes for a comparable package set on the same host. Recommends stay
      # because dropping them is how that repository installed a cross compiler
      # with no target libc; this bundle has shipped with them since 0.10.0 and
      # a green build is not proof about a user's machine.
      - name: System packages
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt_get() {
            sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 "$@"
          }
          for attempt in 1 2 3; do
            if apt_get update && apt_get install -y \
              clang cmake ninja-build pkg-config \
              libgtk-3-dev liblzma-dev libstdc++-12-dev \
              libayatana-appindicator3-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying" >&2
            sleep $((attempt * 15))
          done
          echo "apt failed three times" >&2
          exit 1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: whisper.cpp at the pinned commit
        run: |
          set -euo pipefail
          git init whisper.cpp
          cd whisper.cpp
          git remote add origin "$WHISPER_REPO"
          git fetch --depth 1 origin "$WHISPER_COMMIT"
          git checkout FETCH_HEAD

      - name: Production obfs4 PSK
        env:
          PSK: ${{ secrets.PROD_OBFS4_PSK }}
        run: |
          set -euo pipefail
          if [ -z "$PSK" ]; then
            echo "::error::PROD_OBFS4_PSK is not set — the bundle would build, run and never reach the network."
            exit 1
          fi
          printf '%s\n' "$PSK" > assets/prod/obfs4_psk.b64

      # The call engine is a prebuilt: veil_media/linux/CMakeLists.txt refuses
      # to configure without it, and building one needs a from-source WebRTC
      # checkout that does not fit in a release job. The webrtc-linux workflow
      # produces it by hand; this pins the run that did.
      #
      # Update the pin whenever veil_media/src changes. The symbol check below
      # is what makes a stale pin loud rather than a call that fails at dlsym
      # on someone's machine.
      #
      # This pin WAS 30377834797 (28 July), whose artifact exports 78 of the 87
      # symbols the Dart layer looks up — camera-device selection, all five
      # screen-sharing entry points, the RTP size cap and the Android420 frame
      # push, each a dlsym failure at first call. The check below could not
      # catch it, because it only ever ran against what this pin downloads.
      #
      # It was then 31411542466, whose linux-x64 artifact is fine but whose RUN
      # concluded "failure" — its android-arm64 job died. Pinning a red run
      # works and reads as a mistake, so both engines now come from
      # 31609030118 (12 August), which is green in both jobs. Verified through
      # the artifact API rather than the tick: libveil_media-linux-x64,
      # 2421749 bytes — byte-identical in size to what 31411542466 produced
      # from the same WebRTC pin — and 87 exported / 87 looked up by Dart.
      - name: Prebuilt call engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # THE DURABLE PIN — see the android job for the full note. Filled
          # 2026-08-13 from the same run that produced the android engine, so
          # both come from one release and one WebRTC pin.
          # MOVED 2026-08-29 to `.4`, which carries BOTH linux engines. The
          # 08.13 release has x64 alone — it predates the arm64 bundle, and a
          # matrix that asks it for arm64 gets a 404, which is the pin saying
          # so.
          ENGINE_RELEASE: 'engine-2026.08.29.4'
          # Kept as the fallback route and as the record of where this came
          # from. EXPIRES 2026-11-10; the release above does not.
          ENGINE_RUN: '31609030118'
          ASSET: ${{ matrix.engine_asset }}
        run: |
          set -euo pipefail
          dest=third_party/veil/flutter/veil_media/linux
          mkdir -p "$dest"
          if [ -n "${ENGINE_RELEASE:-}" ]; then
            echo "engine: release $ENGINE_RELEASE from $ENGINE_REPO (no credential)"
            base="$GITHUB_SERVER_URL/$ENGINE_REPO/releases/download/$ENGINE_RELEASE"
            prov="$RUNNER_TEMP/$ASSET.provenance"
            curl -fL --retry 3 --retry-delay 5 --max-time 300 -o "$dest/libveil_media.so" "$base/$ASSET"
            curl -fL --retry 3 --retry-delay 5 --max-time 60 -o "$prov" "$base/$ASSET.provenance"
            echo "--- provenance ---"; cat "$prov"; echo "------------------"
            # tr -d '\r': a provenance written on a Windows runner arrives
            # CRLF, and awk hands back the hash with a carriage return glued to
            # it, so this compares unequal against a byte-identical file. The
            # producer writes LF now; this strips it anyway, because the record
            # travels and the next one may come from a host that does not.
            want="$(awk '/^sha256:/{print $2}' "$prov" | tr -d '\r')"
            got="$(sha256sum "$dest/libveil_media.so" | cut -d' ' -f1)"
            [ -n "$want" ] || { echo "::error::$ASSET.provenance carries no sha256 line — it is not the record it claims to be"; exit 1; }
            [ "$want" = "$got" ] || { echo "::error::the downloaded engine is not the one its provenance describes (recorded $want, got $got)"; exit 1; }
            echo "sha256 matches the published provenance"
          elif [ -n "${ENGINE_RUN:-}" ]; then
            echo "engine: run artifact $ENGINE_RUN — the EXPIRING route"
            echo "::warning::the linux engine still comes from a run artifact, which expires and needs a token. Publish it to an engine release and set ENGINE_RELEASE."
            gh run download "$ENGINE_RUN" -n "${ASSET%.so}" -D "$dest"
          else
            echo "::error::LINUX call engine is not pinned. Run the webrtc-linux workflow and set ENGINE_RELEASE here to the tag its publish job attached to. Without it veil_media/linux/CMakeLists.txt refuses to configure."
            exit 1
          fi
          ls -la "$dest/libveil_media.so"
          # OUTSIDE the branch — see the android job.
          bash scripts/check-media-symbols.sh "$dest/libveil_media.so"

      - name: Build the bundle
        env:
          WHISPER_SRC: ${{ github.workspace }}/whisper.cpp
          CARGO_BUILD_RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src
          CFLAGS: -ffile-prefix-map=${{ github.workspace }}=/src
          CXXFLAGS: -ffile-prefix-map=${{ github.workspace }}=/src
        run: python3 builder.py linux --release

      - name: The bundle carries the PSK and the engine
        run: |
          set -euo pipefail
          root=build/linux/x64/release/bundle
          psk="$root/data/flutter_assets/assets/prod/obfs4_psk.b64"
          [ -s "$psk" ] || { echo "::error::no bundled PSK at $psk"; exit 1; }
          engine="$(find "$root" -name libveil_media.so | head -1)"
          [ -n "$engine" ] || { echo "::error::libveil_media.so is not in the bundle — calls would fail at dlopen"; exit 1; }
          echo "  ok $psk"
          echo "  ok $engine"

      # A Flutter desktop build is a directory; a Release asset is a file.
      - name: Archive
        run: |
          set -euo pipefail
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/xveil-linux-${{ matrix.arch }}.tar.gz" bundle

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}
          path: xveil-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows:
    name: windows bundle (${{ matrix.arch }})
    needs: checks
    if: ${{ !cancelled() && needs.checks.result != 'failure' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            engine_asset: veil_media-win-x64.dll
          - arch: arm64
            runner: windows-11-arm
            engine_asset: veil_media-win-arm64.dll
    runs-on: ${{ matrix.runner }}
    # Unsigned, and it will stay that way until someone buys an Authenticode
    # certificate: SmartScreen warns on first run ("Windows protected your PC"
    # → More info → Run anyway). That is a worse first impression than Linux
    # gets, but unlike macOS the app does run.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      # Puts cl.exe on PATH. The whisper wrapper is linked with MSVC and its
      # .def export list only works from a Developer environment.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: whisper.cpp at the pinned commit
        shell: bash
        run: |
          set -euo pipefail
          git init whisper.cpp
          cd whisper.cpp
          git remote add origin "$WHISPER_REPO"
          git fetch --depth 1 origin "$WHISPER_COMMIT"
          git checkout FETCH_HEAD

      # Desktop reads XVEIL_OBFS4_PSK from the environment first, but falls
      # back to the same bundled asset, and a packaged build has no environment
      # to read. See the note on the android job for why a secret is the right
      # home for it.
      - name: Production obfs4 PSK
        shell: bash
        env:
          PSK: ${{ secrets.PROD_OBFS4_PSK }}
        run: |
          set -euo pipefail
          if [ -z "$PSK" ]; then
            echo "::error::PROD_OBFS4_PSK is not set — the bundle would build, run and never reach the network."
            exit 1
          fi
          printf '%s\n' "$PSK" > assets/prod/obfs4_psk.b64

      # Windows had NO call engine at all until this was wired: veil_media had
      # no windows/ directory, so every published zip through v0.9.1 started,
      # looked healthy and threw at the first voice message. Same pin-a-run
      # mechanism as the linux and android jobs.
      - name: Prebuilt call engine
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # THE DURABLE PIN — see the android job for the full note. FILLED
          # 2026-08-13, last of the three, because Windows was the last engine
          # to reach the release: the from-source route took an hour and five
          # minutes and had to be replaced by the prebuilt WebRTC SDK first.
          # It now builds in under two minutes, which is what made publishing
          # it a two-minute errand instead of a scheduled event.
          #
          # MOVED 2026-08-28 to `engine-2026.08.28.2`, and the move is the
          # point of the release it ships in: the engine built before it takes
          # the COM apartment of whatever thread first touches a camera, and
          # WebRTC's Windows audio device module then dies on the mismatch —
          # measured on Windows 11 with 0.13.4, the app vanished on ANSWERING
          # a call. Fixed in veil 8ea92a10; this DLL is the first build that
          # carries it (its provenance records xveil-commit 26c671ec, the
          # commit that advanced the submodule to it).
          #
          # A new tag rather than a re-upload to `engine-2026.08.28`: that one
          # is already pinned by builds that exist, and replacing its assets
          # would change what those builds mean without their pin changing.
          # The workflow refuses it, correctly.
          # MOVED again to `.4`. `.2` carried the apartment CHECK, which could
          # not work: the process has an MTA, a thread that touches COM without
          # initialising joins it implicitly, and the ADM asks after we do. `.4`
          # builds the ADM on a thread with no apartment yet, so it establishes
          # its own STA with nothing to collide with.
          ENGINE_RELEASE: 'engine-2026.08.29.3'
          # DEAD once ENGINE_RELEASE above is set — the branch below is never
          # taken. Kept as the record of where this engine used to come from:
          # webrtc-windows run 30665287484 (2026-07-31), whose artifact expires
          # 2026-10-29. The comment here said 2026-11-10 until the API was
          # asked; that date belongs to the android artifact. A pin whose
          # expiry is written down from memory is not pinned to anything.
          ENGINE_RUN: '30665287484'
          ASSET: ${{ matrix.engine_asset }}
        run: |
          set -euo pipefail
          dest=third_party/veil/flutter/veil_media/windows
          mkdir -p "$dest"
          if [ -n "${ENGINE_RELEASE:-}" ]; then
            echo "engine: release $ENGINE_RELEASE from $ENGINE_REPO (no credential)"
            base="$GITHUB_SERVER_URL/$ENGINE_REPO/releases/download/$ENGINE_RELEASE"
            # A plain relative path, not RUNNER_TEMP: this is Git Bash, where
            # RUNNER_TEMP is a backslashed Windows path and every tool that
            # touches it needs a different opinion about escaping.
            prov="engine-win-x64.provenance"
            curl -fL --retry 3 --retry-delay 5 --max-time 300 -o "$dest/veil_media.dll" "$base/$ASSET"
            curl -fL --retry 3 --retry-delay 5 --max-time 60 -o "$prov" "$base/$ASSET.provenance"
            echo "--- provenance ---"; cat "$prov"; echo "------------------"
            # tr -d '\r': a provenance written on a Windows runner arrives
            # CRLF, and awk hands back the hash with a carriage return glued to
            # it, so this compares unequal against a byte-identical file. The
            # producer writes LF now; this strips it anyway, because the record
            # travels and the next one may come from a host that does not.
            want="$(awk '/^sha256:/{print $2}' "$prov" | tr -d '\r')"
            got="$(sha256sum "$dest/veil_media.dll" | cut -d' ' -f1)"
            [ -n "$want" ] || { echo "::error::$ASSET.provenance carries no sha256 line — it is not the record it claims to be"; exit 1; }
            [ "$want" = "$got" ] || { echo "::error::the downloaded engine is not the one its provenance describes (recorded $want, got $got)"; exit 1; }
            # Windows is the one platform where this job does NOT re-run the
            # symbol gate: check-media-symbols.sh reads a PE with objdump, and
            # a windows-latest runner has no objdump to read it with — the
            # gate would abort on a missing tool rather than judge the engine.
            # It runs at BUILD time instead, in webrtc-windows.yml, via
            # dumpbin. The sha256 above proves this DLL is that exact binary,
            # so the line below is that gate's verdict travelling with it.
            # Asserted rather than printed: a provenance record nobody checks
            # decays into decoration.
            grep -q '^symbol-check: *PE: exported [0-9]' "$prov" \
              || { echo "::error::$ASSET.provenance records no symbol-check verdict. This is the only evidence the Windows engine exports what Dart looks up, because the gate cannot run on this host."; exit 1; }
            echo "sha256 matches the published provenance, which records:"
            grep '^symbol-check:' "$prov"
            rm -f "$prov"
          elif [ -n "${ENGINE_RUN:-}" ]; then
            echo "engine: run artifact $ENGINE_RUN — the EXPIRING route"
            echo "::warning::the windows engine still comes from a run artifact, which expires and needs a token. Publish it to an engine release and set ENGINE_RELEASE."
            gh run download "$ENGINE_RUN" -n "libveil_media-win-${{ matrix.arch }}" -D "$dest"
          else
            echo "::error::WINDOWS call engine is not pinned. Run the webrtc-windows workflow and set ENGINE_RELEASE here to the tag its publish job attached to. Without it the bundle builds and cannot do voice messages, video notes, calls or speech-to-text."
            exit 1
          fi
          ls -la "$dest/veil_media.dll"

      # `python3` is not the name on a Windows runner.
      #
      # The PATH dance is not optional. `shell: bash` here is Git Bash, and its
      # launcher puts /usr/bin ahead of everything msvc-dev-cmd just set. Git
      # ships a coreutils `link.exe` there — the hard-link utility — and rustc
      # resolves its linker through PATH, so it called that one and the build
      # died on `/usr/bin/link: extra operand ...rcgu.o`. cl.exe has no
      # coreutils twin, so its directory is the reliable way back to the real
      # toolchain. The check afterwards is the point: without it a PATH that
      # silently failed to take effect looks identical until the same cryptic
      # linker error shows up twenty minutes later.
      - name: Build the bundle
        shell: bash
        env:
          WHISPER_SRC: ${{ github.workspace }}/whisper.cpp
          CARGO_BUILD_RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src
        run: |
          set -euo pipefail
          msvc_bin="$(dirname "$(command -v cl.exe)")"
          export PATH="$msvc_bin:$PATH"
          if [ "$(dirname "$(command -v link.exe)")" != "$msvc_bin" ]; then
            echo "::error::link.exe resolves to $(command -v link.exe), not the MSVC one in $msvc_bin"
            exit 1
          fi
          echo "toolchain: $msvc_bin"
          python builder.py windows --release

      # THE VISUAL C++ RUNTIME, shipped rather than assumed.
      #
      # Every binary in this bundle — all fourteen, xveil.exe included — imports
      # MSVCP140.dll, VCRUNTIME140.dll and VCRUNTIME140_1.dll, and Flutter's
      # Windows template copies none of them. A machine with the Visual C++
      # Redistributable installed runs fine, which is every developer machine
      # and this runner; a clean Windows does not. The loader fails on the first
      # statically-imported DLL that needs the runtime and names THAT file, so
      # the first report from v0.10.0 read "the system cannot find
      # hidden_volume_plugin.dll" — a file that is present and correct, sitting
      # right next to the executable.
      #
      # These three are on Microsoft's redistributable-files list; shipping them
      # beside the app is the documented arrangement.
      - name: Visual C++ runtime into the bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'build/windows/${{ matrix.arch }}/runner/Release'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          if (-not $vs) { throw "vswhere found no Visual Studio installation" }
          $want = @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')
          # Searched rather than spelled out: the redist directory is versioned
          # (…\VC\Redist\MSVC\14.4x.xxxxx\x64\Microsoft.VC143.CRT), and both the
          # version and the VC14x folder name move with the toolchain. onecore,
          # debug and spectre variants are not what a normal app links against.
          $found = Get-ChildItem "$vs\VC\Redist\MSVC" -Recurse -File -Include $want -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '\\x64\\' -and
                                  $_.FullName -notmatch 'onecore|debug|spectre' } |
                   Sort-Object FullName -Descending
          foreach ($n in $want) {
            $f = $found | Where-Object { $_.Name -ieq $n } | Select-Object -First 1
            if (-not $f) { throw "no $n under $vs\VC\Redist\MSVC — the bundle would need the redistributable installed on the user's machine" }
            Copy-Item $f.FullName (Join-Path $root $f.Name) -Force
            Write-Host ("  copied {0}  {1:N0} bytes  from {2}" -f $f.Name, $f.Length, $f.DirectoryName)
          }

      - name: The bundle carries the PSK, the engine and the C++ runtime
        shell: bash
        run: |
          set -euo pipefail
          root=build/windows/${{ matrix.arch }}/runner/Release
          psk="$root/data/flutter_assets/assets/prod/obfs4_psk.b64"
          [ -s "$psk" ] || { echo "::error::no bundled PSK at $psk — the bundle cannot reach the production network"; exit 1; }
          engine="$(find "$root" -name veil_media.dll | head -1)"
          [ -n "$engine" ] || { echo "::error::veil_media.dll is not in the bundle — voice messages and calls would fail at LoadLibrary"; exit 1; }
          echo "  ok $psk"
          echo "  ok $engine"
          # Asserted against the BUNDLE, deliberately, and never against the
          # runner's System32. The runner has the redistributable installed —
          # every check that consults the machine passes here and reproduces
          # exactly the bug it was meant to catch.
          for dll in MSVCP140.dll VCRUNTIME140.dll VCRUNTIME140_1.dll; do
            [ -s "$root/$dll" ] || {
              echo "::error::$dll is not in the bundle. Every binary here imports it, so on a Windows without the Visual C++ Redistributable the app dies at startup naming some other DLL entirely."
              exit 1; }
            echo "  ok $root/$dll"
          done

      - name: Archive
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/${{ matrix.arch }}/runner/Release/* `
            -DestinationPath xveil-windows-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.arch }}
          path: xveil-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  # One scan over everything that was built. Kept out of the build jobs so the
  # rule lives in one place rather than three copies drifting apart, and so a
  # leak fails the release rather than only the platform that produced it.
  #
  # The repository scan skips binaries by design; this is the check that would
  # have caught the account name inside the .so files of a release APK.
  # Patterns come from a secret because a list of what must never be published
  # has no business living in a public repository.
  scan:
    name: scan artifacts
    needs: [android, linux, windows]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Scan for leaked identifiers
        env:
          PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: python3 scripts/scan-artifacts.py artifacts

  # A DRAFT: publishing is a decision someone makes after looking at what was
  # built, and none of this has run on a phone.
  #
  # `needs.checks.result == 'success'` and not just "did not fail": a manual
  # dispatch can be launched against a TAG ref with `run_checks: false`, which
  # would otherwise satisfy the tag test above with the suite skipped entirely.
  # Nothing gets attached to a release that analyze and the tests have not seen.
  publish:
    name: draft release
    needs: [checks, scan]
    if: startsWith(github.ref, 'refs/tags/') && needs.checks.result == 'success'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # The ONE job that needs to write: it attaches the artifacts to the draft.
    permissions:
      contents: write
    steps:
      # BEFORE download-artifact, not after: checkout cleans the workspace by
      # default, and a checkout running second would delete the artifacts this
      # job exists to attach.
      #
      # Submodules are not fetched — this job reads one file.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      # The release page's text, from the CHANGELOG entry for this tag.
      #
      # This job used to attach files and write nothing at all, so the page went
      # out blank and the text was added by hand afterwards — if anyone
      # remembered. v0.9.1's notes were written that way, and v0.10.0 reached
      # the point of being published with an empty body before it was caught.
      # Artifacts nobody can read the notes for are artifacts nobody can check.
      - name: Release notes from the CHANGELOG entry for this tag
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          # index(...) == 1 rather than a regex: the version is full of dots,
          # and as a pattern 0.1.0 would match the heading of 0.10.0. The
          # closing bracket is part of the needle for the same reason.
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; print; next}
                         f && /^## \[/ {exit}
                         f {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $v, so this release would publish with an empty page. Add the entry, then move the tag."
            exit 1
          fi
          echo "notes: $(wc -l < "$RUNNER_TEMP/notes.md") lines from the $v entry"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: xVeil ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          # Published, not drafted, the way hidden-volume has always released.
          # A draft is a release nobody can install: v0.13.1 through v0.13.4
          # each built green and then sat unpublished, so `latest` pointed at
          # v0.13.0 and every "which version am I on" answer was a version
          # older than the one that had been cut. The gate that decides whether
          # a tag deserves a release is `analyze + tests` and the three
          # bundles, all of which must pass before this job runs at all —
          # holding the result back afterwards adds a step, not a check.
          draft: false
          files: artifacts/**/*
          fail_on_unmatched_files: true

      # The action above writes the body only when it CREATES the release. Move
      # a tag and re-run, and it replaces every asset while leaving the notes
      # from the first attempt in place -- which is how v0.11.0's draft came to
      # carry fresh binaries under a page saying it was built on
      # hidden-volume v2.0.1, a version it was deliberately re-cut away from.
      # Stale notes are worse than none: an empty page is obviously wrong,
      # a confidently wrong one is not.
      - name: The notes must match the tag, not the first attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json body -q .body > "$RUNNER_TEMP/published-notes.md"
          # Compare the CONTENT, not the trailing whitespace. `-q .body` writes
          # its own closing newline and the API hands the body back with CRLF
          # endings, so a byte-for-byte `diff` calls a correct page wrong -- it
          # could never have matched. v0.12.0 ran analyze, the whole Dart suite
          # and all three bundles green, wrote the right 6054 bytes of notes,
          # and then failed here over ONE empty line. Same defect, same fix as
          # veil 041bdbe5.
          python3 - "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/published-notes.md" <<'PY'
          import difflib, sys
          def read(p):
              return open(p, encoding="utf-8").read().replace("\r\n", "\n").rstrip("\n")
          want, got = read(sys.argv[1]), read(sys.argv[2])
          if want != got:
              print("::error::the release page does not carry the CHANGELOG entry")
              sys.stdout.writelines(difflib.unified_diff(
                  want.splitlines(True), got.splitlines(True), "expected", "published"))
              sys.exit(1)
          print(f"notes on the release page match ({len(want)} bytes)")
          PY
