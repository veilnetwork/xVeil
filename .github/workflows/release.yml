name: release

# A tag builds the APKs. Everything slow and everything that only re-proves
# what the local gate already proved is opt-in: `run_checks` on a manual
# dispatch. Building on a runner also keeps the builder's home directory out
# of the binary — `libapp.so` carries the absolute path of the Flutter plugin
# registrant, and there is no remap flag for it, so a laptop build always
# names its owner. `/home/runner/work/...` does not.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      run_checks:
        description: 'Also run analyze + the Dart suite (slow, off by default)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # to attach the APKs to a draft Release

env:
  FLUTTER_VERSION: '3.44.0'
  # Pinned rather than tracking master: this is a third-party checkout that
  # ends up inside the shipped .so, and an unpinned dependency is a
  # supply-chain decision made by whoever pushed last.
  WHISPER_REPO: 'https://github.com/ggml-org/whisper.cpp.git'
  WHISPER_COMMIT: '7695a5331230c585f5ce92291c4256973985ae5a'
  NDK_VERSION: '27.0.12077973'

jobs:
  # Opt-in only. `analyze` and the 1985-test suite are the local pre-tag gate;
  # running them again on every tag costs runner minutes to learn nothing.
  checks:
    name: analyze + tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    name: android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Rust with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          # i686 is here only because hidden-volume's build-android.sh checks
          # for all four targets up front, even when asked for three ABIs.
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      # The runner image already carries a complete NDK. Downloading another
      # one gave a tree whose clang was missing at the path cmake was told to
      # use, and cmake only says so after configuring — hence the explicit
      # check here rather than a failure three steps later.
      - name: Android NDK
        id: ndk
        run: |
          set -euo pipefail
          p="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$p" ] || [ ! -d "$p" ]; then
            p="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          cc="$p/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          if [ ! -x "$cc" ]; then
            echo "::error::no usable NDK clang at $cc"
            ls -la "$ANDROID_HOME/ndk" 2>/dev/null || true
            exit 1
          fi
          echo "using NDK $p"
          echo "path=$p" >> "$GITHUB_OUTPUT"

      # Not a submodule and not vendored, so the exact revision has to be
      # named here. Its static libraries are linked into libveil_whisper.so.
      - name: whisper.cpp at the pinned commit
        run: |
          set -euo pipefail
          git init whisper.cpp
          cd whisper.cpp
          git remote add origin "$WHISPER_REPO"
          git fetch --depth 1 origin "$WHISPER_COMMIT"
          git checkout FETCH_HEAD

      # -ffile-prefix-map here and --remap-path-prefix below: rustc and the C
      # compiler each bake their own source paths into the binary, and neither
      # flag covers the other. A release APK once carried the builder's
      # account name 213 times because only one of the two was set.
      - name: whisper static libs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.path }}
        run: |
          set -euo pipefail
          cd whisper.cpp
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DGGML_METAL=OFF -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=OFF \
            -DCMAKE_C_FLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=/src" \
            -DCMAKE_CXX_FLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=/src"
          cmake --build build-android -j "$(nproc)"

      # gradle's cargo-ndk task builds veilclient_ffi during `flutter build`,
      # but hidden-volume ships a PREBUILT .so in jniLibs that nothing
      # regenerates — locally that library sat four days stale without a word
      # in any build log. Build it explicitly so CI cannot inherit that.
      - name: hidden-volume cdylib
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.path }}
          CARGO_BUILD_RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src
          CFLAGS: -ffile-prefix-map=${{ github.workspace }}=/src
          CXXFLAGS: -ffile-prefix-map=${{ github.workspace }}=/src
        working-directory: third_party/hidden-volume
        run: ABIS="arm64-v8a armeabi-v7a x86_64" PROFILE=release ./scripts/build-android.sh

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — gradle would fall back to the debug key and produce an APK that can never be updated over."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          umask 077
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      # builder.py is the same entry point used by hand, so CI and a laptop
      # cannot drift: it sets the path-remap environment, runs the whisper
      # wrapper, builds one APK per ABI and fails if the signing key is absent.
      - name: Build the APKs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.path }}
          NDK: ${{ steps.ndk.outputs.path }}
          WHISPER_SRC: ${{ github.workspace }}/whisper.cpp
        run: python3 builder.py android --release

      # The repository scan skips binaries by design; this is the one that
      # would have caught the account name inside the .so files. Patterns come
      # from a secret because a list of what must never be published has no
      # business living in a public repository.
      - name: Scan the artifacts for leaked identifiers
        env:
          PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          set -uo pipefail
          if [ -z "$PATTERNS" ]; then
            echo "::error::LEAK_PATTERNS is not set — this check would pass by knowing nothing."
            exit 1
          fi
          printf '%s\n' "$PATTERNS" > "$RUNNER_TEMP/patterns.txt"
          lit=(); allow=()
          while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
              're:'*)  continue ;;
              'allow:'*) entry="${line#allow:}"; entry="${entry%%#*}"
                         allow+=("$(echo "$entry" | xargs)") ;;
              *)       lit+=(-e "$line") ;;
            esac
          done < "$RUNNER_TEMP/patterns.txt"
          rc=0
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            echo "== $apk"
            for entry in $(unzip -l "$apk" | awk 'NR>3 && NF>=4 {print $4}' | grep -v '^$'); do
              ctx="$(unzip -p "$apk" "$entry" 2>/dev/null | strings -a | grep -aiF "${lit[@]}" | sort -u || true)"
              for a in "${allow[@]}"; do
                [ -n "$a" ] && ctx="$(grep -vF -- "$a" <<< "$ctx" || true)"
              done
              if [ -n "${ctx// }" ]; then
                echo "::error file=$entry::leaked identifier in $entry: $(head -1 <<< "$ctx")"
                rc=1
              fi
            done
          done
          exit $rc

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: xveil-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      # A DRAFT: publishing is a decision someone makes after looking at what
      # was built, and this build has never run on a phone.
      - name: Attach to a draft Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: xVeil ${{ github.ref_name }}
          draft: true
          files: build/app/outputs/flutter-apk/*-release.apk
          fail_on_unmatched_files: true
