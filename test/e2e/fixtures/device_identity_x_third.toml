# TEST-ONLY device identity for the end-to-end multi-device harness
# (test/e2e/device_fixture.dart). The private key is intentionally
# public and must NEVER be used outside an isolated loopback test.
[global]
runtime_flavor = "multi_thread"
admin_max_connections = 32
logs = "stderr"
log_level = "info"
log_format = "text"
announce_schedule = "always"
meeting_points = "all"
meeting_policy = "fallback"
meeting_min_peers = 5
bootstrap_dns_allow_system = true
builtin_seed_policy = "auto"
mlkem_rotation_secs = 691200
tls_ech_grease = true

[transport]
bandwidth_mimicry_enabled = false

[transport.rotation]
min_lifetime_secs = 1800
max_lifetime_secs = 3600

[transport.tls_fingerprint]
mode = "rotate"
profile = "chrome"
rotation = [
    "chrome",
    "firefox",
    "safari",
]
sticky = true

[Identity]
algo = "ed25519"
public_key = "CdIzj5VqJeM81yvK+Q7XpzDM7y4ujcmCAfqB/zt+thk="
private_key = "kDWqau4RhwuKPdazqcN2uE1qSBFY2HppeBDbR0vbIMI="
nonce = "AD9LYw=="
node_id = "d02f4777568b44d43308a42b109c3e81d9375f1b0bb7c0e608bc06a0369cc305"

[mobile]
low_battery_multiplier = 0
background_keepalive_multiplier = 0
