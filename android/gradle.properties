org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9: built-in Kotlin stays OFF globally because several plugin modules
# (file_picker, hidden_volume, mobile_scanner, package_info_plus,
# veil_flutter, wakelock_plus) still apply the legacy Kotlin Android plugin,
# which cannot coexist with built-in Kotlin in the same module. :app opts in
# per-module via com.android.built-in-kotlin (android/app/build.gradle.kts).
android.builtInKotlin=false
# The legacy kotlin-android plugin is incompatible with AGP 9's new DSL
# implementation, so the KGP-applying plugin modules above also require the
# legacy DSL.
android.newDsl=false
