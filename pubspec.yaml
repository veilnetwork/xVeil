name: xveil
description: "xVeil — decentralized, censorship-resistant messenger and overlay-network client"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.13.13+21

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management — chosen for testability and the ports/adapters
  # architecture (fakes injected via ProviderScope overrides).
  flutter_riverpod: ^3.3.2
  # Declarative routing with redirect-based gating (lock screen / onboarding).
  go_router: ^17.3.0
  # i18n — primary audience is Russian-speaking users in censored regions.
  intl: any
  # `@visibleForTesting` on the headless daemon's import path. Flutter re-exports
  # it through `foundation.dart`, which that path must not import — one
  # package:flutter import stopped `dart build cli` producing the daemon at all
  # (see the note in lib/data/veil_stack.dart). Declared rather than taken
  # transitively so `flutter analyze` stays clean, which the release tag runs
  # before anything else.
  meta: ^1.16.0
  # Unicode grapheme boundaries for the shared-note sequence CRDT. Flutter
  # selections use UTF-16 offsets, but CRDT atoms must never split emoji or a
  # combining sequence into independently deletable halves.
  characters: ^1.4.1
  # App-local directories for the hidden-volume container + node state dir.
  path_provider: ^2.1.5
  # Stable ids for local-only entities.
  uuid: ^4.5.1
  # SHA-256 for content-addressing (piece + manifest hashes). The bundled
  # blake3.dart is single-chunk (<=1 KiB) only — it can't hash multi-KiB pieces.
  crypto: ^3.0.7
  # AEAD (ChaCha20-Poly1305) for the on-disk LARGE-FILE tier (Phase B): blobs too
  # big for the hidden-volume index live as encrypted files on the normal FS,
  # sealed per-piece under a per-blob random key kept in the volume. Vetted Dart
  # crypto — we do NOT hand-roll AEAD for a deniability tool.
  cryptography: ^2.7.0
  # Non-sensitive UI prefs ONLY (theme, locale). Never secrets — those live
  # in the hidden-volume container. See doc/SECURITY-NOTES.md.
  #
  # BACKED BY A FILE, not by the platform's system store: NSUserDefaults lives
  # in a directory iOS owns and copies into iCloud backups, and no
  # exclude-from-backup flag reaches it (audit XV-16). The platform interface is
  # a direct dependency because `ProfilePreferencesStore` implements it.
  shared_preferences: ^2.3.3
  shared_preferences_platform_interface: ^2.4.0
  # QR rendering for the bootstrap-invite contact-exchange flow.
  qr_flutter: ^4.1.0
  # Camera QR scanning for redeeming a contact's invite. Version 7 uses the
  # native Apple Vision stack instead of ML Kit on iOS, so the same production
  # plugin works on device and ARM64 Simulator without a fake scanner package.
  mobile_scanner: ^7.4.0
  # Camera capture for photo/video attachments and the compatibility call path.
  # Production Android calls use the app-owned native Camera2 path; macOS uses
  # AVCaptureSession inside libveil_media.
  camera: ^0.12.0+2
  # Pure-Dart SSH client for "My nodes" — connect to a server you run and
  # provision/check a veil node over SSH (no native code).
  dartssh2: ^2.9.0
  # Direct dart:ffi helpers (Utf8/calloc) for the embedded-node binding.
  ffi: ^2.1.0

  # --- Native storage layer (path dep to the hidden-volume submodule) ---
  # The real Storage adapter (HvKvLogStore) binds to this. The plugin ships
  # android/ios/windows native impls today; desktop (macOS/Linux) link glue
  # is pending, so the running app still selects the in-memory SpaceOpener.
  hidden_volume:
    path: third_party/hidden-volume/experimental/flutter_plugin/hidden_volume

  # --- Native overlay-network layer (path dep to the veil submodule) ---
  # The real VeilTransport adapter (VeilFlutterTransport) binds to this. Like
  # hidden_volume it ships android/ios native hooks only; desktop uses the
  # VEIL_FFI_DYLIB preload path. App still selects the loopback transport at
  # runtime until live-node wiring lands.
  veil_flutter:
    path: third_party/veil/flutter/veil_flutter
  # Call media engine (audio/video/screen over veil): Dart control surface for
  # libveil_media.dylib (codec-stripped libwebrtc), loaded via process().
  veil_media:
    path: third_party/veil/flutter/veil_media
  file_picker: ^11.0.2
  flutter_local_notifications: ^22.1.0
  # Desktop (macOS/Linux/Windows) system-tray + window control: close-to-tray so
  # the node keeps running (and delivering notifications) with the window hidden.
  # No-op on mobile — guarded by Platform.isMacOS/Linux/Windows at every call.
  tray_manager: ^0.5.0
  window_manager: ^0.5.1
  # Opening http(s) links from message text — ONLY ever behind an explicit
  # tap → confirm dialog (never auto-open), so the user consciously hands the
  # URL to the system browser. Privacy: opening leaks the URL to the browser +
  # destination, hence the deliberate consent step.
  # The android impl USED to be pinned below 6.3.16, because newer versions pull
  # androidx.core 1.17 / androidx.browser 1.9 which demand AGP 8.9.1+ and the
  # project sat on AGP 8.7.3. That pin said to revisit it once the AGP pin
  # moved — it has: the project builds on AGP 9.0.1 / Gradle 9.1.0, so the
  # androidx floor is met and the impl floats with url_launcher again.
  # In-chat video playback (media epic). The official plugin still omits Linux;
  # media_kit/libmpv is rejected for good (LGPL + codec stack). Linux plays
  # video attachments through the native veil_media bricks instead (WebM
  # demuxed in Dart, VP8 via the windowed VNOTE1 player, Opus via the voice
  # player — NativeVideoPlayer).
  video_player: ^2.11.0
  url_launcher: ^6.3.0
  # Non-call capture (attachments/video notes) still uses the plugin. Calls use
  # the app-owned native Camera2 path so preview and send capture never cross
  # Flutter's platform channel frame-by-frame.
  camera_android: ^0.10.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Direct test seam for the attachment camera lifecycle. The production
  # implementation remains selected by package:camera at runtime.
  camera_platform_interface: ^2.13.1
  # Used directly by deterministic call timing tests. Keep them explicit
  # instead of relying on flutter_test's transitive dependency graph.
  clock: ^1.1.2
  fake_async: ^1.3.3

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Generates platform app icons from assets/icon/app_icon.png (veil_icon).
  flutter_launcher_icons: ^0.14.4

# App-icon generation (run: dart run flutter_launcher_icons). Source is the
# veil project's icon, copied into assets/icon/.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#0E1414"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  web:
    generate: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generate typed localization accessors (AppLocalizations) from the
  # .arb files under lib/l10n/. Configured by l10n.yaml at the repo root.
  generate: true

  assets:
    - assets/geoip/country_routes.json.gz
    - assets/geoip/NOTICE.txt
    - assets/icon/app_icon.png
    # Tray art: generated by tool/make_tray_icon.py from tray_icon_source.png
    # (the 1254px source lives next to it but is deliberately NOT bundled).
    - assets/icon/tray_icon.png
    - assets/icon/tray_icon.ico
    # Deployment network material (seed descriptors + obfs4 PSK), one directory
    # per network. BOTH are bundled: which one the app reads is decided at
    # runtime by the build mode (see lib/data/node/network_flavor.dart), and a
    # directory that is not in the manifest cannot be read at all. The PSK files
    # themselves are gitignored; each dir always holds README.md so clean clones
    # still build.
    - assets/prod/
    - assets/testnet/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
